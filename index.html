hed all prop pages and bakasana/crow hits (pp.139-148, 339, 292)."}}, {"topic": "teaching", "type": "pair", "sub": "prop", "label": "Name a use of a prop", "prompt": "Salamba sarvanghasana", "answer": "2 blankets stacked under the shoulders (shoulder ridge), head on the floor.", "flag": false, "id": "127", "ord": 8, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 239, "q": "Shoulderstand: 2 Blankets under shoulder ridge, head resting on ﬂoor, shoulders propped up"}], "fix": null, "note": "p.239; draft matches."}}, {"topic": "teaching", "type": "pair", "sub": "prop", "label": "Name a use of a prop", "prompt": "Matsyasana", "answer": "Block under the upper back (and optionally one under the head) for a supported fish.", "flag": false, "id": "128", "ord": 9, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 240, "q": "Supported ﬁsh: (2 blocks/ bolster)"}], "fix": "Manual: Supported fish with 2 blocks or a bolster (p.240).", "note": "Draft's block under upper back and optional block under head is compatible but the manual specifies '2 blocks/bolster'. Block count check: draft uses blocks for 3 shapes (Parsvakonasana, Malasana, Matsyasana), within the 'up to 3' rule; the manual also lists blanket/rolled mat alternatives for Malasana."}}, {"topic": "teaching", "type": "recall", "q": "When cueing a posture, what is the most effective way to begin ordering your directives?", "a": "Start from the FOUNDATION and build the posture from the GROUND UP — begin with the base/feet and work upward. (MRY Manual: “Build the posture from the ground up,” “Instructing from the Ground Up,” “Start with their foundation,” “Start at the base of the pose.”)", "w": false, "mytype": false, "flag": false, "id": "129", "ord": 10, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 33, "q": "Build the posture from the ground up. Grow from the base."}, {"f": "manual", "p": 87, "q": "we can teach from the ground up."}, {"f": "manual", "p": 120, "q": "Teach from the back to the front."}], "fix": null, "note": "Draft quotes ('Instructing from the Ground Up', 'Start with their foundation', 'Start at the base of the pose') - the first three are verbatim titles/headings on pp.33, 87, 120; 'Start at the base of the pose' is a paraphrase of p.87."}}, {"topic": "teaching", "type": "recall", "q": "Following the question above, in order, provide 5 succinct alignment and/or energetic cues for virabhadrasana A.", "a": "Virabhadrasana A, ground-up order: (1) FOUNDATION – front foot forward, back foot in ~45°, heel-to-arch; ground the four corners of the front foot and the outer edge of the back foot. (2) LEGS – bend the front knee over the ankle toward 90°; straighten and engage the back leg. (3) PELVIS – square the hips to the front; lengthen the tailbone down. (4) CORE/TORSO – draw the lower belly up, lengthen the side waist, lift the chest. (5) ARMS & GAZE – reach the arms overhead (urdhva hastasana), soften the shoulders; drishti forward/up to the thumbs.", "w": true, "mytype": false, "flag": false, "id": "131", "ord": 11, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 110, "q": "In postures like Virabadrasana I (Warrior 1), it is anatomically impossible to do this."}, {"f": "manual", "p": 121, "q": "A nice way to teach Vira A is to break down a high lunge and then introduce the action of the back foot turning forwards."}, {"f": "manual", "p": 120, "q": "Teach from the back to the front."}], "fix": "Ground-up ordering is supported (pp.33, 87, 120) but no Vira A cue list exists (posture pages 364-365 are blank templates). Caution: draft cue 3 'square the hips to the front' conflicts with p.110, which says squaring the hips in Warrior 1 is anatomically impossible (the 'Hips' cue entry says squaring is wanted in pyramid, not Warrior 1). Use e.g. back foot turned forward from high lunge (p.121), urdhva hastasana with belly drawn in, back ribs lifted, neutral pelvis (p.121).", "note": "Draft cues are self-constructed; flagged one that the manual specifically cautions against."}}, {"topic": "beginners", "type": "recall", "q": "What are any 2 important aspects of teaching beginners?", "a": "(1) START WITH THEIR FOUNDATION — build a relationship with the feet (e.g., Tadasana: ground the four corners, spread the toes) and awareness of the hands; elongate the spine (“root down to rise up”). (2) USE CLEAR, SIMPLE LANGUAGE AND REPEAT instructions/poses — repetition builds confidence (and only slowly sprinkle in Sanskrit). (MRY Manual – Yoga for Beginners)", "w": true, "mytype": false, "flag": false, "id": "134", "ord": 0, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 120, "q": "Start With Their Foundation:"}, {"f": "manual", "p": 120, "q": "Use clear and simple language."}, {"f": "manual", "p": 121, "q": "Repeat instructions and poses. Repetition builds conﬁdence."}], "fix": null, "note": "Matches pp.120-121; other valid items: teach from back to front, slowly sprinkle in Sanskrit, don't get caught up in tricks."}}, {"topic": "beginners", "type": "recall", "q": "Name 2 modifications inside sun salutations when teaching beginners?", "a": "(1) STEP back / step forward (instead of jumping) between poses. (2) Use BLOCKS under the hands in Uttanasana (and introduce plank, knees-down chaturanga, and cobra instead of up-dog), synchronizing breath with movement. (MRY Manual – Yoga for Beginners)", "w": true, "mytype": false, "flag": false, "id": "136", "ord": 1, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 120, "q": "Surya Namaskara: teach step backs, step forwards, and uttanasana using blocks. Synchronize the breath with the movement. Introduce plank, chaturanga and cobra."}, {"f": "manual", "p": 110, "q": "It is better to have students modify with knees to the ﬂoor"}], "fix": null, "note": "Step back/step forward and Uttanasana with blocks are verbatim p.120; knees-down chaturanga supported by p.110 (Effective Cueing). 'Cobra instead of up-dog' is the draft's inference from 'introduce ... cobra'."}}, {"topic": "beginners", "type": "recall", "q": "What is an effective tool to use if beginner students don’t understand verbal cues?", "a": "DEMONSTRATE the pose — physically show/mirror it (use your body as the visual) rather than relying on words alone. (MRY Manual: “mirror or demonstrate different poses”; “verbalize… then demonstrate in silence.”)", "w": false, "mytype": false, "flag": false, "id": "138", "ord": 2, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 50, "q": "mirror or demonstrate diﬀerent poses."}, {"f": "manual", "p": 51, "q": "Demonstrations should be used sparingly."}, {"f": "manual", "p": 60, "q": "Try verbalizing instruction for these asanas, then demon- strating the poses in silence."}], "fix": "Demonstration is the manual's closest answer (pp.50-51, 60), but the manual does not explicitly pose this beginner question; p.51 cautions demonstrations 'should be used sparingly' (use when several students are not executing a pose correctly) and p.120 stresses clear, simple language. Physical assists/touch (p.51, with consent) are another tool.", "note": "Searched demonstrat/mirror/visual/assist in pp.36-66, 105-125; no explicit answer found."}}, {"topic": "sequencing", "type": "mc", "q": "Which one of these sequences does not change hip rotation?", "opts": ["Virabhadrasana A → Virabhadrasana B → Utthita trikonasana", "Alanasana → Virabhadrasana B → Utthita trikonasana", "Virabhadrasana B → Utthita parsvakonasana → Alanasana", "Virabhadrasana A → Virabhadrasana C → Alanasana"], "correct": 3, "a": "Virabhadrasana A → Virabhadrasana C → Alanasana — all keep the hips squared/facing forward (same orientation). [Reasoned from the manual's “hip rotation = keeping hips oriented the same.”]", "flag": false, "marked": true, "id": "141", "ord": 0, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 147, "q": "Hip Rotation: Keeping the hips oriented the same throughout an entire sequence (internal vs. external) is a way to ensure the practitioner can protect their pelvic, hip, and sacral region."}], "fix": null, "note": "Draft answer (Virabhadrasana A -> Virabhadrasana C -> Alanasana) is consistent with the definition: all three are squared-hip (hips neutral/internally-rotated back leg) shapes, whereas Vira B, trikonasana and parsvakonasana are open-hip/externally-rotated shapes, so the other three options all switch rotation. The manual does not classify individual poses, so this relies on standard anatomy plus p.110 ('Warrior 1 ... square' discussion)."}, "draftCorrect": 3}, {"topic": "sequencing", "type": "mc", "q": "Which one of these sequences does not change foot pattern?", "opts": ["Warrior 1 → Warrior 2 → Wide legged forward fold", "High lunge → Warrior 2 → Triangle", "High lunge twist → High lunge → Warrior 3", "Warrior 2 → Wide legged forward fold → Warrior 2 other side"], "correct": 2, "a": "Warrior 1 → Warrior 2 → Wide-legged forward fold — the wide stance/foot placement is maintained (open hips/torso, then straighten to fold) rather than swivelling the back heel up/down or lifting a foot. [Reasoned from the manual's foot-pattern definition & its “Warrior II→Triangle: feet stay the same” example — confirm.]", "flag": true, "marked": true, "id": "147", "ord": 1, "check": {"v": "CONTRADICTED", "ev": [{"f": "manual", "p": 147, "q": "Foot Patterns: Does the practitioner need to change how their feet are connected to the ground?"}, {"f": "manual", "p": 147, "q": "Good example: war- rior II to triangle pose- feet stay the same. Bad example: crescent pose to warrior II- the back foot has to swivel down, compromising the SI joint."}], "fix": "High lunge twist -> High lunge -> Warrior 3 (the front foot and back-foot ball stay planted; no swivel). Warrior 1 -> Warrior 2 swivels the back foot (the manual's own bad example: crescent/lunge to Warrior II), High lunge -> Warrior 2 swivels likewise, and Warrior 2 -> Wide-legged forward fold -> Warrior 2 other side re-sets the feet. The draft's Warrior 1 -> Warrior 2 -> Wide-legged is therefore wrong.", "note": "By elimination using the p.147 definition and bad example; Warrior 3 lifts the back foot but does not change how the grounded feet connect. Manual gives no explicit answer key (moderate confidence)."}, "draftCorrect": 0}, {"topic": "sequencing", "type": "recall", "q": "List 5 postures that you would sequence in building up to ardha chandrasana:", "a": "Example build-up: 1) Tadasana (grounding & balance) 2) Utthita Trikonasana (triangle — lateral length + grounding) 3) Utthita Parsvakonasana (side angle — leg strength + opening) 4) Virabhadrasana II (warrior II — hip external rotation + strength) 5) Vrksasana / Utthita Hasta Padangusthasana (single-leg balance) → then Ardha Chandrasana. (Built per the manual's peak-pose prep method.)", "w": true, "mytype": false, "flag": false, "id": "153", "ord": 2, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 146, "q": "DECONSTRUCT THE PEAK POSE: Decide what actions the practitioner must be familiar with to make the pose happen."}, {"f": "manual", "p": 146, "q": "CONNECT THE DOTS: Link the poses that mimic your peak pose intelligently. Simple transitions between poses usually work best."}], "fix": "Method (choose peak, deconstruct, prep poses that mimic actions, connect with simple transitions, counter-poses) is supported on pp.146-147, but no Ardha Chandrasana build-up list is given; the draft list is plausible but self-constructed. Ardha Chandrasana appears on the Weekend 5 worksheets list (p.127) and posture page 404 (blank template).", "note": "Searched ardha chandrasana/half moon across manual; draft flagged its own construction."}}, {"topic": "sequencing", "type": "circle", "q": "Circle all the transitions below that we would (generally) consider to be too complicated to teach to beginners or in one-breath transition:", "opts": [{"t": "Warrior 1 → Humble warrior", "correct": false}, {"t": "Virabhadrasana A → Ardha chandrasana", "correct": true}, {"t": "High lunge → Extended side angle", "correct": false}, {"t": "Prasarita padottanasana C → Utthita trikonasana", "correct": true}, {"t": "Pyramid → Revolved triangle", "correct": true}, {"t": "Vrksasana → Natarajasana", "correct": true}, {"t": "Twisting high lunge → Revolved chair", "correct": true}, {"t": "Tadasana → Malasana", "correct": false}, {"t": "Warrior 3 → Standing split", "correct": true}, {"t": "Parivrtta trikonasana → Parivrtta ardha chandrasana", "correct": true}], "a": "CIRCLE (too complex for beginners/one-breath): Virabhadrasana A→Ardha Chandrasana; Prasarita Padottanasana C→Utthita Trikonasana; Pyramid→Revolved Triangle; Vrksasana→Natarajasana; Twisting High Lunge→Revolved Chair; Warrior 3→Standing Split; Parivrtta Trikonasana→Parivrtta Ardha Chandrasana. LEAVE (fine for beginners): Warrior 1→Humble Warrior; High Lunge→Extended Side Angle; Tadasana→Malasana. [Reasoned by complexity — confirm.]", "flag": true, "id": "160", "ord": 3, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 146, "q": "Simple transitions between poses usually work best."}, {"f": "manual", "p": 147, "q": "When in doubt, simple is always best!"}, {"f": "manual", "p": 147, "q": "Bad example: crescent pose to warrior II- the back foot has to swivel down, compromising the SI joint."}], "fix": "The manual gives only principles (changing foot pattern or hip rotation compromises the foundation; keep transitions simple; teach Vira B before Vira A, p.121; do not get caught up in tricks, p.120) and no list of which transitions to circle. The draft's circles are reasonable. One inconsistency to consider: High lunge -> Extended side angle is left uncircled, yet it needs the back foot to swivel down (hip rotation square -> open), the exact pattern the manual calls a 'bad example' (p.147). The Warrior 1 -> Humble Warrior and Tadasana -> Malasana leave-alone choices fit the principles.", "note": "Searched creative sequencing, one breath, transition, beginner, foot pattern, hip rotation; also p.149 (one-breath-per-movement flows use foundational postures)."}}, {"topic": "sequencing", "type": "recall", "q": "When working with a peak posture, why is it important to include postures that counter the peak? Please give an example.", "a": "When you focus on a peak, the body works in a similar way all class; COUNTER-POSES work the body in the OPPOSITE direction so students leave BALANCED. Example: if you've worked forward folds all class, include a (supported) backbend during closing. (MRY Manual – Peak Poses / Counter-Poses)", "w": false, "mytype": false, "flag": false, "id": "172", "ord": 4, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 147, "q": "In order to make sure your students leave feeling balanced, after the peak pose you want to throw in some poses that work the body in the oppo- site way."}, {"f": "manual", "p": 147, "q": "If you’re been working forward folds all class, throw in a supported back- bend during closing."}], "fix": null, "note": "Matches p.147 almost verbatim (including the forward fold/supported backbend example)."}}]};

function chkHTML(it){
  const c=it.check;if(!c)return "";
  const ev=(c.ev||[]).map(e=>`<div class="ev"><b>${esc(SRCNAME[e.f]||e.f)} p.${e.p}</b>: “${esc(e.q)}”</div>`).join("");
  const cls={SUPPORTED:"ok",PARTIAL:"warn",NOT_FOUND:"warn",CONTRADICTED:"bad"}[c.v]||"warn";
  const lab={SUPPORTED:"Checked against your course materials: supported",PARTIAL:"Checked: partly supported by your course materials",NOT_FOUND:"Checked: not found in the manual or readings. Confirm with class notes",CONTRADICTED:"Checked: differs from your course materials"}[c.v];
  const fix=(c.fix&&c.v!=="CONTRADICTED")?`<div class="fixline"><b>Fuller answer per course materials:</b> ${fmt(c.fix)}</div>`:"";
  return `<div class="chk ${cls}"><div class="chkh">${lab}</div>${ev}${fix}${c.note?`<div class="cnote">${esc(c.note)}</div>`:""}</div>`;
}
function verifyHTML(it){
  if(!needsVerify(it))return "";
  const v=!!XS.verified[it.id];
  return `<div class="vbox ${v?"done":""}"><label class="vchk"><input type="checkbox" data-vid="${it.id}" ${v?"checked":""}> I verified this against my class notes</label><textarea class="vta" data-cid="${it.id}" placeholder="Your corrected answer or the class-notes version (saved on this device)">${esc(XS.mine["c_"+it.id]||"")}</textarea></div>`;
}
function wireAns(el,it){
  el.querySelectorAll("input[data-vid]").forEach(i=>{i.onchange=()=>{XS.verified[it.id]=i.checked;save();i.closest(".vbox").classList.toggle("done",i.checked);};});
  el.querySelectorAll("textarea[data-cid]").forEach(t=>{t.oninput=()=>{XS.mine["c_"+it.id]=t.value;save();};});
}
function answerHTML(it,mainHTML,extra){
  const c=it.check;const main=mainHTML!==undefined?mainHTML:fmt(it.a||"");
  const mine=XS.mine["c_"+it.id];let h="";
  if(mine)h+=`<div class="mynote"><b>Your note:</b> ${esc(mine)}</div>`;
  if(c&&c.v==="CONTRADICTED"&&c.fix)h+=`<div class="afix"><b>Per course materials:</b> ${fmt(c.fix)}</div><details class="draft"><summary>Draft answer in your study guide (differs)</summary><div class="atxt">${main}</div></details>`;
  else h+=`<div class="atxt">${main}</div>`;
  h+=extra||"";
  if(it.draftCorrect!=null&&it.draftCorrect!==it.correct&&it.opts)h+=`<div class="chk bad"><div class="chkh">Your study guide marked “${esc(it.opts[it.draftCorrect])}”. The course materials point to “${esc(it.opts[it.correct])}”.</div></div>`;
  return h+chkHTML(it)+verifyHTML(it);
}
function grader(it,onResult){
  const g=div("xgrade",'<button class="btn" data-g="0">Review again</button><button class="btn good" data-g="1">Got it</button>');
  g.querySelectorAll("button").forEach(b=>{b.onclick=()=>{const ok=b.dataset.g==="1";setStatus(it,ok);g.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");onResult(ok);};});
  return g;
}
function deckButtons(sas){return sas.map(sa=>`<button class="btn link" data-sa="${esc(sa)}">See ${esc(sa)} in Asanas ›</button>`).join("");}
function wireDeck(el){el.querySelectorAll("button[data-sa]").forEach(b=>{b.onclick=()=>window.showPose(b.dataset.sa);});}

/* ---- renderers ---- */
function rRecall(it,body,onResult){
  body.appendChild(div("xq",fmt(it.q)));
  if(it.w){const ta=document.createElement("textarea");ta.className="xmine";ta.placeholder="Write your answer first, then reveal the model answer";ta.value=XS.mine[it.id]||"";ta.oninput=()=>{XS.mine[it.id]=ta.value;save();};body.appendChild(ta);}
  const rev=document.createElement("button");rev.className="btn primary";rev.textContent="Show answer";body.appendChild(rev);
  const ans=div("xans hide");body.appendChild(ans);
  rev.onclick=()=>{rev.style.display="none";ans.classList.remove("hide");ans.innerHTML=answerHTML(it);
    if(it.mytype){const w=div("mynote",`<b>Which are you?</b> <select id="mytype"><option value="">Choose</option><option>Athlete</option><option>Scientist</option><option>Mystic</option><option>A blend</option></select>`);ans.appendChild(w);const s=w.querySelector("select");s.value=XS.mytype||"";s.onchange=()=>{XS.mytype=s.value;save();};}
    wireAns(ans,it);ans.appendChild(grader(it,onResult));};
}
function rMC(it,body,onResult){
  body.appendChild(div("xq",fmt(it.q)));
  const list=div("xopts");body.appendChild(list);const ans=div("xans hide");
  it.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="xopt";b.textContent=o;
    b.onclick=()=>{if(list.dataset.done)return;list.dataset.done="1";const ok=i===it.correct;b.classList.add(ok?"right":"wrong");list.children[it.correct].classList.add("right");setStatus(it,ok);
      ans.classList.remove("hide");ans.innerHTML=(ok?'<div class="res ok">Correct</div>':'<div class="res bad">Not quite</div>')+answerHTML(it);wireAns(ans,it);onResult(ok);};
    list.appendChild(b);});
  body.appendChild(ans);
}
function rPair(it,body,onResult){
  body.appendChild(div("xlab",esc(it.label)));
  body.appendChild(div("xprompt",esc(it.prompt)));
  const rev=document.createElement("button");rev.className="btn primary";rev.textContent="Reveal";body.appendChild(rev);
  const ans=div("xans hide");body.appendChild(ans);
  rev.onclick=()=>{rev.style.display="none";ans.classList.remove("hide");
    const c=it.check;const shown=(c&&c.v==="CONTRADICTED"&&c.fix)?c.fix:it.answer;
    const big=it.sub==="prop"?`<div class="atxt">${fmt(shown)}</div>`:`<div class="xbig">${esc(shown)}</div>`;
    let links=[];
    if(it.sub==="posture"){const d=deckFor(shown)||deckFor(it.answer);if(d)links=[d.sa];}
    if(it.sub==="direction"){links=examplesFor(it.answer);}
    let extra="";
    if(links.length)extra+=`<div>${deckButtons(links)}</div>`;
    if(it.sub==="direction"&&!links.length&&EXTRA_EX[nrm(it.answer)])extra+=`<div class="atxt" style="margin-top:8px">Example: ${esc(EXTRA_EX[nrm(it.answer)][0])}</div>`;
    ans.innerHTML=answerHTML(it,big,extra);
    wireAns(ans,it);wireDeck(ans);ans.appendChild(grader(it,onResult));};
}
function rMatch(it,body,onResult){
  body.appendChild(div("xq",fmt(it.q)));
  const terms=it.pairs.map(p=>p[0]);const defs=shuf(it.pairs.map(p=>p[1]));
  const grid=div("xmatch");body.appendChild(grid);
  let sel=null,errors=0,matched=0;const L=[],R=[];
  terms.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{if(b.classList.contains("ok"))return;L.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=i;};L.push(b);});
  defs.forEach((d,j)=>{const b=document.createElement("button");b.textContent=d;b.onclick=()=>{if(sel===null||b.classList.contains("ok"))return;
    if(it.pairs[sel][1]===d){L[sel].classList.remove("sel");L[sel].classList.add("ok");b.classList.add("ok");sel=null;matched++;
      if(matched===terms.length){const ans=div("xans");ans.innerHTML=`<div class="res ${errors?"bad":"ok"}">${errors?errors+" wrong tries":"Perfect"}</div>`+answerHTML(it);body.appendChild(ans);wireAns(ans,it);setStatus(it,errors===0);onResult(errors===0);}}
    else{errors++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);}};R.push(b);});
  // interleave rows: term on the left, definition on the right
  for(let i=0;i<terms.length;i++){grid.appendChild(L[i]);grid.appendChild(R[i]);}
}
function rCircle(it,body,onResult){
  body.appendChild(div("xq",fmt(it.q)));
  const list=div("xcirc");body.appendChild(list);const btns=[];
  it.opts.forEach(o=>{const b=document.createElement("button");b.textContent=o.t;b.onclick=()=>{if(list.dataset.done)return;b.classList.toggle("on");};list.appendChild(b);btns.push(b);});
  const chk=document.createElement("button");chk.className="btn primary";chk.textContent="Check my circles";body.appendChild(chk);
  const ans=div("xans hide");body.appendChild(ans);
  chk.onclick=()=>{if(list.dataset.done)return;list.dataset.done="1";chk.style.display="none";let ok=true;
    btns.forEach((b,i)=>{const on=b.classList.contains("on"),should=it.opts[i].correct;b.classList.remove("on");if(on===should)b.classList.add("right");else{b.classList.add("wrong");ok=false;}if(should)b.textContent="◯ "+b.textContent;});
    setStatus(it,ok);ans.classList.remove("hide");ans.innerHTML=`<div class="res ${ok?"ok":"bad"}">${ok?"All correct":"Some differ from the answer key (green = matches, red = differs; the circle marks the ones to circle)"}</div>`+answerHTML(it);wireAns(ans,it);onResult(ok);};
}
const RENDER={recall:rRecall,mc:rMC,pair:rPair,match:rMatch,circle:rCircle};
function renderItem(it,onResult){
  const topic=EXAM.topics.find(t=>t.id===it.topic)||{name:""};
  const card=div("xcard");card.style.setProperty("--cat",TCOL[it.topic]||"var(--purple)");
  card.appendChild(div("xhd",`<span class="tag" style="background:${TCOL[it.topic]||"#6433A0"}">${esc(topic.name)}</span>${statusChip(it)}${isOpenVerify(it)?'<span class="vtag">verify</span>':""}`));
  const body=div("xbody");card.appendChild(body);RENDER[it.type](it,body,onResult);return card;
}

/* ---- runner ---- */
let run=null;
function startRun(items,title,opts){
  opts=opts||{};
  if(!items.length){root.innerHTML=`<div class="xbar"><button class="btn" id="xBack">← Back</button><div class="xtitle">${esc(title)}</div><div></div></div><div class="xcard"><div class="xq">Nothing here yet.</div></div>`;$("xBack").onclick=home;return;}
  run={items:items.slice(),idx:0,title,mock:!!opts.mock,res:{}};runView();
}
function runView(){
  const it=run.items[run.idx];const n=run.items.length;
  root.innerHTML=`<div class="xbar"><button class="btn" id="xBack">← ${run.mock?"Quit":"Topics"}</button><div class="xtitle">${esc(run.title)}</div><div class="xcount">${run.idx+1} / ${n}</div></div><div class="progress"><span style="width:${run.idx/n*100}%"></span></div><div id="xHost"></div><div class="nav"><button class="btn" id="xPrev">‹ Prev</button><button class="btn" id="xNext">${run.idx===n-1?"Finish":"Next ›"}</button></div>`;
  $("xBack").onclick=home;
  $("xHost").appendChild(renderItem(it,ok=>{run.res[it.id]=ok;if(run.mock)$("xNext").disabled=false;}));
  const prev=$("xPrev"),next=$("xNext");
  prev.disabled=run.mock||run.idx===0;
  if(run.mock&&run.res[it.id]===undefined)next.disabled=true;
  prev.onclick=()=>{run.idx--;runView();window.scrollTo(0,0);};
  next.onclick=()=>{if(run.idx<n-1){run.idx++;runView();window.scrollTo(0,0);}else if(run.mock)mockDone();else home();};
}
function mockDone(){
  const n=run.items.length;const ok=run.items.filter(i=>run.res[i.id]).length;
  XS.mockBest=Math.max(XS.mockBest||0,ok/n);save();
  const missed=run.items.filter(i=>!run.res[i.id]);
  root.innerHTML=`<div class="xbar"><button class="btn" id="xBack">← Home</button><div class="xtitle">Mock exam result</div><div></div></div><div class="xscore"><div class="big">${ok} / ${n}</div><div class="xsub">${Math.round(ok/n*100)}% · best so far ${Math.round(XS.mockBest*100)}%</div></div><div class="xmiss">${missed.length?`<div class="xlab">Missed (now in Weak spots)</div>`+missed.map(m=>`<div class="xhit" style="--cat:${TCOL[m.topic]}">${esc(shortQ(m))}</div>`).join(""):'<div class="xsub" style="text-align:center">No misses. Nice.</div>'}</div><div class="xactions">${missed.length?'<button class="btn primary" id="xRetry">Review the misses</button>':""}<button class="btn" id="xHome2">Back to Exam Prep</button></div>`;
  $("xBack").onclick=home;$("xHome2").onclick=home;if(missed.length)$("xRetry").onclick=()=>startRun(missed,"Missed in mock");
}
function shortQ(it){const s=it.type==="pair"?(it.label+": "+it.prompt):it.q;return s.length>110?s.slice(0,107)+"...":s;}

/* ---- home / topics ---- */
function daysLeft(){const d=new Date(XS.examDate+"T00:00:00");const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5);}
function topicStats(t){const its=EXAM.items.filter(i=>i.topic===t.id);return{tot:its.length,got:its.filter(i=>XS.status[i.id]==="got").length,rev:its.filter(i=>XS.status[i.id]==="review").length,ver:its.filter(isOpenVerify).length};}
function weakItems(){return EXAM.items.filter(i=>XS.status[i.id]==="review");}
function verifyItems(){return EXAM.items.filter(isOpenVerify);}
function home(){
  run=null;
  if(!EXAM.items.length){root.innerHTML='<div class="xcard"><div class="xq">Exam content has not been loaded.</div></div>';return;}
  const all=EXAM.items.length,got=EXAM.items.filter(i=>XS.status[i.id]==="got").length;
  const dl=daysLeft();const cd=dl>0?`${dl} day${dl===1?"":"s"} to the exam`:dl===0?"Exam day":"The exam date has passed";
  const weak=weakItems().length,ver=verifyItems().length;
  root.innerHTML=`<div class="xhero"><div class="xh1">Midterm Exam Prep</div><div class="xsub">${cd}</div><div class="xdate">Exam date <input type="date" id="xdate" value="${esc(XS.examDate)}"></div></div>
  <div class="progress"><span style="width:${got/all*100}%"></span></div><div class="plabel"><b>${got}</b> of ${all} cards marked got it</div>
  <div class="xactions"><button class="btn primary" id="xCont">Continue</button><button class="btn" id="xWeak">Weak spots (${weak})</button><button class="btn" id="xVer">To verify (${ver})</button><button class="btn" id="xMock">Mock exam</button><button class="btn" id="xPlan">14-day plan</button></div>
  <input class="xsearch" id="xsearch" placeholder="Search questions and answers"><div class="xsres" id="xsres"></div>
  <div class="xtopics">${EXAM.topics.map((t,i)=>{const s=topicStats(t);return `<button class="xtile" data-t="${t.id}" style="--cat:${TCOL[t.id]}"><div class="xtn">${i+1}. ${esc(t.name)}</div><div class="xtm">${s.got}/${s.tot} got it${s.rev?` · ${s.rev} to review`:""}</div><div class="xbarm"><span style="width:${s.tot?s.got/s.tot*100:0}%"></span></div>${s.ver?`<span class="vtag">${s.ver} to verify</span>`:""}</button>`;}).join("")}</div>
  <div class="xfoot">The answers were drafted from your course materials and then checked against them. Amber items are not confirmed by the manual or readings, so check them against your class notes.</div>`;
  $("xdate").onchange=e=>{if(e.target.value){XS.examDate=e.target.value;save();home();}};
  $("xCont").onclick=()=>startRun(EXAM.items.filter(i=>XS.status[i.id]!=="got"),"Continue");
  $("xWeak").onclick=()=>startRun(weakItems(),"Weak spots");
  $("xVer").onclick=()=>startRun(verifyItems(),"To verify with class notes");
  $("xMock").onclick=()=>startRun(shuf(EXAM.items).slice(0,20),"Mock exam",{mock:true});
  $("xPlan").onclick=planView;
  root.querySelectorAll(".xtile").forEach(b=>{b.onclick=()=>{const t=EXAM.topics.find(x=>x.id===b.dataset.t);startRun(EXAM.items.filter(i=>i.topic===t.id),t.name);};});
  const sb=$("xsearch"),sr=$("xsres");
  sb.oninput=()=>{const q=sb.value.trim().toLowerCase();sr.innerHTML="";if(q.length<2)return;
    const hits=EXAM.items.filter(i=>(i.q||"").toLowerCase().includes(q)||(i.a||"").toLowerCase().includes(q)||(i.prompt||"").toLowerCase().includes(q)||(i.answer||"").toLowerCase().includes(q)).slice(0,8);
    sr.innerHTML=hits.length?"":'<div class="xsub">No matches</div>';
    hits.forEach(h=>{const b=document.createElement("button");b.className="xhit";b.style.setProperty("--cat",TCOL[h.topic]);b.innerHTML=`<small>${esc((EXAM.topics.find(t=>t.id===h.topic)||{}).name||"")}</small>${esc(shortQ(h))}`;b.onclick=()=>startRun([h],"Search");sr.appendChild(b);});};
}

/* ---- 14-day plan ---- */
const PLAN=[
 {t:"Ashtanga Yoga",d:"Parampara, bandhas, tristana, the 8 limbs, namaste, moksha, yamas and niyamas.",pick:i=>i.topic==="ashtanga"},
 {t:"Ancient Texts, Modern History, Breath & Meditation",d:"Sutra, upanishad, atma, the two lineages, the 4 parts of the breath.",pick:i=>["ancient","history","breath"].includes(i.topic)},
 {t:"Energetic Anatomy and Sanskrit postures",d:"Nadis and kundalini, then translate the 10 postures.",pick:i=>i.topic==="energetic"||(i.topic==="sanskrit"&&(i.sub==="posture"||i.type==="recall"))},
 {t:"Sanskrit direction words",d:"The 10 direction words. Look each one up in the Asanas tab.",pick:i=>i.topic==="sanskrit"&&i.sub==="direction"},
 {t:"Anatomy, part 1",d:"Movements, definitions and the first half of the anatomy cards.",pick:i=>i.topic==="anatomy"&&i.ord<6},
 {t:"Anatomy, part 2",d:"Spine, directions and the safety questions.",pick:i=>i.topic==="anatomy"&&i.ord>=6},
 {t:"Review day",d:"Everything you marked Review again.",weak:true},
 {t:"Teaching Methodology",d:"Personality types, ujjayi cues, Warrior B cues, props, ground-up cueing.",pick:i=>i.topic==="teaching"},
 {t:"Beginners",d:"Teaching beginners, sun salutation modifications, demonstrating.",pick:i=>i.topic==="beginners"},
 {t:"Creative Sequencing",d:"Hip rotation, foot pattern, building to Ardha Chandrasana, transitions, counter-poses.",pick:i=>i.topic==="sequencing"},
 {t:"Verify day",d:"Go through every amber item with your class notes.",verify:true},
 {t:"Mock exam",d:"20 random questions, then look at the misses.",mock:true},
 {t:"Asana deck run",d:"Flip the Asanas tab in both directions, especially the poses on the exam.",asana:true},
 {t:"Weak spots and a second mock",d:"Clean up what is left, then a final mock.",weak:true}
];
function planView(){
  const dl=daysLeft();const today=15-dl;
  const ex=new Date(XS.examDate+"T00:00:00");
  root.innerHTML=`<div class="xbar"><button class="btn" id="xBack">← Back</button><div class="xtitle">14-day plan</div><div></div></div><div class="xsub" style="text-align:center;margin-bottom:12px">Day 14 is the day before your exam (${ex.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}). Tick a day when you finish it.</div><div class="xdays">${PLAN.map((p,i)=>{const n=i+1;const d=new Date(ex);d.setDate(d.getDate()-(15-n));const done=!!XS.planDone[n];return `<div class="xday ${n===today?"today":""} ${done?"done":""}"><input type="checkbox" data-d="${n}" ${done?"checked":""}><div class="dn">Day ${n}${n===today?'<span class="tdy">today</span>':""}</div><div class="dt"><b>${esc(p.t)}</b><small>${d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})} · ${esc(p.d)}</small></div><button class="btn" data-o="${i}">Open</button></div>`;}).join("")}</div>`;
  $("xBack").onclick=home;
  root.querySelectorAll("input[data-d]").forEach(c=>{c.onchange=()=>{XS.planDone[c.dataset.d]=c.checked;save();planView();};});
  root.querySelectorAll("button[data-o]").forEach(b=>{b.onclick=()=>{const p=PLAN[+b.dataset.o];
    if(p.mock)startRun(shuf(EXAM.items).slice(0,20),"Mock exam",{mock:true});
    else if(p.verify)startRun(verifyItems(),"To verify with class notes");
    else if(p.asana){window.setMode("asana");}
    else if(p.weak)startRun(weakItems(),"Weak spots");
    else startRun(EXAM.items.filter(p.pick),p.t);};});
}

/* ---- mode switch ---- */
window.setMode=function(m){
  window.MODE=m;$("asanaApp").style.display=m==="asana"?"":"none";$("examApp").style.display=m==="exam"?"":"none";
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  try{localStorage.setItem("mry_mode",m);}catch(e){}
  if(m==="exam")home();
  window.scrollTo(0,0);
};
document.querySelectorAll("#modeSeg button").forEach(b=>{b.onclick=()=>window.setMode(b.dataset.mode);});
window.MODE="asana";
(function(){
  const h=location.hash||"";let saved=null;try{saved=localStorage.getItem("mry_mode");}catch(e){}
  if(h.indexOf("#exam")===0||(!h&&saved==="exam")){
    window.setMode("exam");
    if(h==="#exam/plan")planView();
    else if(h.indexOf("#exam/topic/")===0){const t=EXAM.topics.find(x=>x.id===h.slice(12));if(t)startRun(EXAM.items.filter(i=>i.topic===t.id),t.name);}
  }
})();
window.__exam={XS:()=>XS,home,startRun,renderItem,PLAN,planView};
})();
