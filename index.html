<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtanga Primary Series — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Holicow design tokens (tokens.jsx, Brand Manual Mar 2026) */
  :root{
    --purple:#6433A0; --indigo:#1B1642; --ink900:#0A0A0F; --ink800:#2A2A33;
    --ink700:#4A4A57; --ink600:#6B6B78; --ink500:#8A8A95; --ink300:#D4D4DB;
    --ink200:#E8E8ED; --ink100:#F4F4F2; --bg:#FAFAF7; --card:#FFFFFF;
    --display:'Montserrat',-apple-system,sans-serif; --body:'Open Sans',-apple-system,sans-serif;
    --r-lg:14px; --r-xl:20px; --r-pill:999px;
    --sh-md:0 2px 6px rgba(10,10,15,.06),0 1px 2px rgba(10,10,15,.04);
    --sh-lg:0 8px 24px rgba(10,10,15,.08),0 2px 6px rgba(10,10,15,.04);
    --warm:#C25E00; --cool:#2B6C8F; --neutral:#6B6B78;
    --splash:linear-gradient(90deg,#E63946 0%,#F77F00 16%,#FFBE0B 32%,#4CB944 48%,#2EC4B6 64%,#3A86FF 82%,#7209B7 100%);
  }
  @media (prefers-color-scheme:dark){
    :root{--indigo:#C9B8E8; --ink900:#EDE7DC; --ink800:#DED8CC; --ink700:#B9B1A4;
      --ink600:#A79D8F; --ink500:#8f867a; --ink300:#3f3a33; --ink200:#33302a; --ink100:#262320;
      --bg:#1b1917; --card:#262320; --purple:#b48aec; --warm:#E8954A; --cool:#6FB3D1;
      --sh-md:0 2px 8px rgba(0,0,0,.35); --sh-lg:0 10px 30px rgba(0,0,0,.45);}
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--body); background:var(--bg); color:var(--ink800); line-height:1.55; -webkit-font-smoothing:antialiased; padding:0 14px 60px}
  .strip{height:3px; background:var(--splash); margin:0 -14px 16px}
  .wrap{max-width:580px; margin:0 auto}
  header{text-align:center; margin-bottom:6px}
  h1{font-family:var(--display); font-weight:700; font-size:1.3rem; color:var(--indigo); margin:4px 0 2px}
  .sub{color:var(--ink600); font-size:.82rem}
  .controls{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0 4px}
  select,.btn{font:inherit; font-size:.82rem; padding:8px 13px; border-radius:var(--r-pill); border:1px solid var(--ink300); background:var(--card); color:var(--ink800); cursor:pointer; font-family:var(--body)}
  .btn:hover,select:hover{border-color:var(--purple)}
  .btn.primary{background:var(--purple); color:#fff; border-color:var(--purple)}
  .seg{display:inline-flex; border:1px solid var(--ink300); border-radius:var(--r-pill); overflow:hidden; background:var(--card)}
  .seg button{border:0; background:transparent; font:inherit; font-family:var(--body); font-size:.82rem; padding:8px 13px; cursor:pointer; color:var(--ink700)}
  .seg button.on{background:var(--purple); color:#fff}
  .progress{height:6px; background:var(--ink200); border-radius:var(--r-pill); margin:14px 0 4px; overflow:hidden}
  .progress>span{display:block; height:100%; background:var(--purple); width:0; transition:width .3s}
  .plabel{text-align:center; font-size:.76rem; color:var(--ink600); margin-bottom:12px}
  .plabel b{color:var(--purple)}

  .scene{perspective:1600px}
  .card{position:relative; width:100%; min-height:470px; cursor:pointer; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--card); border:1px solid var(--ink200); border-radius:var(--r-xl); box-shadow:var(--sh-lg); padding:24px; display:flex; flex-direction:column}
  .face::before{content:""; position:absolute; top:0; left:0; right:0; height:4px; border-radius:var(--r-xl) var(--r-xl) 0 0; background:var(--cat,var(--purple))}
  .back{transform:rotateY(180deg)}
  .toprow{display:flex; justify-content:space-between; align-items:center}
  .tag{font-family:var(--display); font-weight:600; font-size:.64rem; letter-spacing:.9px; text-transform:uppercase; padding:4px 11px; border-radius:var(--r-pill); color:#fff; background:var(--cat,var(--purple))}
  .num{color:var(--ink500); font-size:.72rem; font-family:var(--display); font-weight:500}
  .front .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
  .figbox{margin-bottom:10px}
  .poseimg{width:188px; height:188px; object-fit:contain; border-radius:14px; background:#fff; border:1px solid var(--ink200); box-shadow:var(--sh-md)}
  .poseimg.sm{width:66px; height:66px; border-radius:10px; box-shadow:none}
  .noimg{width:170px; height:70px; display:flex; align-items:center; justify-content:center; color:var(--ink500); font-size:.76rem; font-style:italic; border:1px dashed var(--ink300); border-radius:12px}
  .noimg.sm{width:66px; height:66px; font-size:1rem}
  .bhead{display:flex; gap:12px; align-items:center; margin-top:10px}
  .figbox-sm{flex:0 0 auto}
  .prime{font-family:var(--display); font-weight:600; font-size:2rem; margin:0; line-height:1.15; color:var(--indigo)}
  .prime.sa{font-style:italic; font-family:var(--body); font-weight:600}
  .pron{color:var(--ink600); font-size:.92rem; margin-top:12px; font-style:italic}
  .role-front{color:var(--ink500); font-size:.8rem; margin-top:18px; max-width:32ch}
  .hint{text-align:center; color:var(--ink500); font-size:.72rem; margin-top:8px}

  .back h2{font-family:var(--body); font-style:italic; font-weight:600; font-size:1.4rem; margin:12px 0 0; color:var(--indigo)}
  .back .eng{color:var(--ink600); font-size:.9rem; margin:2px 0 10px}
  .lens{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
  .chip{font-size:.68rem; padding:3px 9px; border-radius:var(--r-pill); border:1px solid var(--ink300); display:inline-flex; align-items:center; gap:5px; color:var(--ink700)}
  .chip .dot{width:8px; height:8px; border-radius:50%}
  .rows{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
  .row{display:flex; gap:10px; font-size:.85rem}
  .row .k{flex:0 0 82px; color:var(--ink500); text-transform:uppercase; font-size:.63rem; letter-spacing:.6px; padding-top:3px; font-family:var(--display); font-weight:600}
  .row .v{flex:1; color:var(--ink800)}
  .cue{background:var(--ink100); border-left:3px solid var(--cat,var(--purple)); border-radius:8px; padding:11px 13px; font-size:.87rem; margin-top:auto}
  .cue .k{font-family:var(--display); color:var(--cat,var(--purple)); text-transform:uppercase; font-size:.61rem; letter-spacing:.8px; font-weight:700; margin-bottom:4px}

  .nav{display:flex; gap:10px; margin-top:16px}
  .nav .btn{flex:1; font-size:.95rem; padding:13px}
  .learn{flex:0 0 auto !important}
  .learn.on{background:#2D7A5F; color:#fff; border-color:#2D7A5F}
  .keys{text-align:center; font-size:.72rem; color:var(--ink500); margin-top:12px}
  kbd{font-family:var(--display); font-size:.68rem; background:var(--ink200); padding:1px 6px; border-radius:4px; color:var(--ink700)}

  .overlay{position:fixed; inset:0; background:rgba(10,10,15,.5); display:none; z-index:50; padding:16px 12px; overflow:auto}
  .overlay.open{display:block}
  .sheet{max-width:640px; margin:16px auto; background:var(--card); border-radius:var(--r-xl); box-shadow:var(--sh-lg); overflow:hidden}
  .shead{background:var(--indigo); color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0}
  .shead h2{font-family:var(--display); font-weight:700; font-size:1rem; margin:0}
  .shead .x{background:transparent; border:0; color:#fff; font-size:1.4rem; cursor:pointer; line-height:1}
  .sbody{padding:18px 20px}
  .sbody h3{font-family:var(--display); font-weight:700; font-size:.8rem; letter-spacing:.4px; text-transform:uppercase; color:var(--purple); margin:20px 0 8px}
  .sbody h3:first-child{margin-top:0}
  .sbody p{font-size:.87rem; margin:0 0 10px}
  .sbody ul{margin:0 0 10px; padding-left:18px} .sbody li{font-size:.87rem; margin-bottom:5px}
  .arc{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:4px 0 12px}
  .arc span{font-family:var(--display); font-weight:600; font-size:.64rem; padding:5px 9px; border-radius:var(--r-pill); color:#fff}
  .arc i{color:var(--ink400); font-style:normal}
  .maptbl{width:100%; border-collapse:collapse; font-size:.8rem; margin-bottom:10px}
  .maptbl th,.maptbl td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--ink200); vertical-align:top}
  .maptbl th{font-family:var(--display); font-size:.64rem; letter-spacing:.4px; text-transform:uppercase; color:var(--ink500)}
  .maptbl td b{font-family:var(--display); font-weight:600}
  .fam{border-left:3px solid var(--fc,var(--purple)); padding:2px 0 2px 11px; margin-bottom:14px}
  .fam h4{font-family:var(--display); font-weight:700; font-size:.82rem; margin:0 0 2px; color:var(--fc,var(--indigo))}
  .fam .pr{font-size:.82rem; font-style:italic; color:var(--ink600); margin:0 0 6px}
  .fam ul{margin:4px 0} .fam .guard{font-size:.8rem; color:var(--ink700)} .fam .guard b{color:var(--warm)}
  .src{font-size:.73rem; color:var(--ink500); margin-top:14px}
/*EXAM_CSS_START*/

  /* ===== Exam Prep ===== */
  .modebar{display:flex; justify-content:center; margin:0 0 14px}
  .modebar .seg button{padding:9px 20px; font-weight:600}
  .xhero{text-align:center; margin-bottom:6px}
  .xh1{font-family:var(--display); font-weight:700; font-size:1.3rem; color:var(--indigo)}
  .xsub{color:var(--ink600); font-size:.82rem; margin-top:2px}
  .xdate{margin-top:8px; font-size:.78rem; color:var(--ink600)}
  .xdate input{font:inherit; font-size:.78rem; padding:4px 8px; border:1px solid var(--ink300); border-radius:8px; background:var(--card); color:var(--ink800)}
  .xactions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0 10px}
  .xsearch{width:100%; font:inherit; font-size:.88rem; padding:10px 14px; border:1px solid var(--ink300); border-radius:var(--r-pill); background:var(--card); color:var(--ink800); margin-bottom:12px}
  .xsearch:focus{outline:2px solid var(--purple); outline-offset:1px}
  .xsres{margin-bottom:12px}
  .xhit{display:block; width:100%; text-align:left; font:inherit; font-size:.84rem; padding:9px 12px; margin-bottom:6px; border:1px solid var(--ink200); border-left:3px solid var(--cat,var(--purple)); border-radius:10px; background:var(--card); color:var(--ink800); cursor:pointer}
  .xhit:hover{border-color:var(--purple)}
  .xhit small{display:block; color:var(--ink500); font-size:.7rem; margin-bottom:2px}
  .xtopics{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media (max-width:420px){.xtopics{grid-template-columns:1fr}}
  .xtile{position:relative; text-align:left; font:inherit; padding:14px 14px 12px; background:var(--card); border:1px solid var(--ink200); border-top:4px solid var(--cat,var(--purple)); border-radius:var(--r-lg); box-shadow:var(--sh-md); cursor:pointer; color:var(--ink800)}
  .xtile:hover{border-color:var(--purple); border-top-color:var(--cat,var(--purple))}
  .xtn{font-family:var(--display); font-weight:600; font-size:.88rem; color:var(--indigo); margin-bottom:3px}
  .xtm{font-size:.74rem; color:var(--ink600); margin-bottom:8px}
  .xbarm{height:5px; border-radius:999px; background:var(--ink200); overflow:hidden}
  .xbarm span{display:block; height:100%; background:var(--cat,var(--purple))}
  .vtag{display:inline-block; font-family:var(--display); font-weight:600; font-size:.6rem; letter-spacing:.5px; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:#FFF1D6; color:#8A5A00; border:1px solid #F0C36A; margin-top:8px}
  .xhd .vtag{margin-top:0; margin-left:6px}
  @media (prefers-color-scheme:dark){.vtag{background:#3b2f14; color:#F0C36A; border-color:#7a5d1c}}
  .xfoot{margin-top:16px; font-size:.74rem; color:var(--ink500); text-align:center}

  .xbar{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .xbar .btn{padding:7px 12px}
  .xtitle{flex:1; font-family:var(--display); font-weight:600; font-size:.9rem; color:var(--indigo); text-align:center}
  .xcount{font-size:.78rem; color:var(--ink500); font-family:var(--display)}
  .xcard{position:relative; background:var(--card); border:1px solid var(--ink200); border-radius:var(--r-xl); box-shadow:var(--sh-lg); padding:22px 20px 20px; margin-top:12px}
  .xcard::before{content:""; position:absolute; top:0; left:0; right:0; height:4px; border-radius:var(--r-xl) var(--r-xl) 0 0; background:var(--cat,var(--purple))}
  .xhd{display:flex; align-items:center; gap:6px; margin-bottom:12px; flex-wrap:wrap}
  .xchip{font-size:.66rem; color:var(--ink500); border:1px solid var(--ink300); border-radius:999px; padding:1px 8px}
  .xchip.got{color:#2D7A5F; border-color:#2D7A5F}
  .xchip.review{color:#A8322F; border-color:#A8322F}
  .xq{font-size:1.02rem; line-height:1.5; color:var(--ink900); margin-bottom:14px; font-weight:600; font-family:var(--body)}
  .xsub{font-size:.7rem}
  .xlab{font-family:var(--display); font-weight:600; font-size:.64rem; letter-spacing:.6px; text-transform:uppercase; color:var(--ink500); margin-bottom:6px}
  .xprompt{font-family:var(--display); font-weight:600; font-size:1.6rem; color:var(--indigo); margin:6px 0 16px}
  .xbig{font-family:var(--body); font-style:italic; font-weight:600; font-size:1.4rem; color:var(--indigo)}
  .xmine,.vta{width:100%; min-height:84px; font:inherit; font-size:.88rem; padding:10px 12px; border:1px solid var(--ink300); border-radius:10px; background:var(--card); color:var(--ink800); margin-bottom:10px; resize:vertical}
  .xmine:focus,.vta:focus{outline:2px solid var(--purple); outline-offset:1px}
  .xans{margin-top:14px; padding-top:14px; border-top:1px dashed var(--ink300)}
  .hide{display:none}
  .atxt{font-size:.9rem; line-height:1.6; color:var(--ink800)}
  .atxt b{color:var(--indigo)}
  .bnote{color:var(--ink600); font-style:italic}
  .cite{color:var(--ink500); font-size:.78rem}
  .afix{font-size:.9rem; line-height:1.6; background:#E8F6F1; border-left:3px solid #2D7A5F; border-radius:8px; padding:10px 12px; color:#1c4d3b}
  @media (prefers-color-scheme:dark){.afix{background:#17332a; color:#bfe6d6}}
  .draft{margin-top:8px; font-size:.82rem; color:var(--ink600)}
  .draft summary{cursor:pointer}
  .mynote{font-size:.86rem; background:var(--accent-soft,#efe6d4); border-radius:8px; padding:8px 12px; margin-bottom:10px}
  .chk{margin-top:12px; border-radius:10px; padding:10px 12px; font-size:.78rem; border:1px solid var(--ink300); background:var(--ink100)}
  .chk .chkh{font-family:var(--display); font-weight:600; font-size:.7rem; margin-bottom:4px}
  .chk.ok{border-color:#2D7A5F; background:#EAF6F0}.chk.ok .chkh{color:#2D7A5F}
  .chk.warn{border-color:#F0C36A; background:#FFF8E8}.chk.warn .chkh{color:#8A5A00}
  .chk.bad{border-color:#d98c8a; background:#FCEEEE}.chk.bad .chkh{color:#A8322F}
  @media (prefers-color-scheme:dark){.chk.ok{background:#17332a}.chk.warn{background:#3b2f14}.chk.bad{background:#3a1d1d}}
  .chk .ev{color:var(--ink700); margin-top:3px; line-height:1.45}
  .chk .fixline,.chk .cnote{margin-top:6px; color:var(--ink700)}
  .vbox{margin-top:12px; padding:12px; border:1px dashed #F0C36A; border-radius:10px; background:#FFFBF1}
  .vbox.done{border-color:#2D7A5F; background:#F1FAF6}
  @media (prefers-color-scheme:dark){.vbox{background:#2b2412}.vbox.done{background:#14291f}}
  .vchk{display:flex; align-items:center; gap:8px; font-size:.82rem; margin-bottom:8px; cursor:pointer}
  .vta{min-height:56px; margin-bottom:0}
  .xgrade{display:flex; gap:10px; margin-top:14px}
  .xgrade .btn{flex:1; padding:11px}
  .btn.good{border-color:#2D7A5F; color:#2D7A5F}
  .btn.sel{background:var(--purple); color:#fff; border-color:var(--purple)}
  .btn.good.sel{background:#2D7A5F; border-color:#2D7A5F; color:#fff}
  .btn.link{font-size:.76rem; padding:6px 12px; margin:8px 6px 0 0}
  .xopts{display:flex; flex-direction:column; gap:8px}
  .xopt{text-align:left; font:inherit; font-size:.92rem; padding:12px 14px; border:1px solid var(--ink300); border-radius:12px; background:var(--card); color:var(--ink800); cursor:pointer}
  .xopt:hover{border-color:var(--purple)}
  .xopt.right{border-color:#2D7A5F; background:#EAF6F0; color:#1c4d3b}
  .xopt.wrong{border-color:#A8322F; background:#FCEEEE; color:#7d2422}
  @media (prefers-color-scheme:dark){.xopt.right{background:#17332a;color:#bfe6d6}.xopt.wrong{background:#3a1d1d;color:#f0b3b1}}
  .res{font-family:var(--display); font-weight:700; font-size:.8rem; margin-bottom:8px}
  .res.ok{color:#2D7A5F}.res.bad{color:#A8322F}
  .xmatch{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px}
  .xmatch button{font:inherit; font-size:.86rem; padding:10px; border:1px solid var(--ink300); border-radius:10px; background:var(--card); color:var(--ink800); cursor:pointer}
  .xmatch button.sel{border-color:var(--purple); background:var(--accent-soft,#efe6d4)}
  .xmatch button.ok{border-color:#2D7A5F; background:#EAF6F0; color:#1c4d3b; cursor:default}
  .xmatch button.no{border-color:#A8322F; background:#FCEEEE}
  @media (prefers-color-scheme:dark){.xmatch button.ok{background:#17332a;color:#bfe6d6}.xmatch button.no{background:#3a1d1d}}
  .xcirc{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
  .xcirc button{text-align:left; font:inherit; font-size:.88rem; padding:11px 14px; border:1px solid var(--ink300); border-radius:12px; background:var(--card); color:var(--ink800); cursor:pointer}
  .xcirc button.on{border-color:var(--purple); background:var(--accent-soft,#efe6d4)}
  .xcirc button.right{border-color:#2D7A5F; background:#EAF6F0; color:#1c4d3b}
  .xcirc button.wrong{border-color:#A8322F; background:#FCEEEE; color:#7d2422}
  @media (prefers-color-scheme:dark){.xcirc button.right{background:#17332a;color:#bfe6d6}.xcirc button.wrong{background:#3a1d1d;color:#f0b3b1}}
  .xdays{display:flex; flex-direction:column; gap:8px}
  .xday{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--ink200); border-radius:12px; background:var(--card)}
  .xday.today{border-color:var(--purple); box-shadow:0 0 0 2px var(--accent-soft,#efe6d4)}
  .xday.done{opacity:.6}
  .xday .dn{font-family:var(--display); font-weight:700; font-size:.78rem; color:var(--purple); min-width:58px}
  .xday .dt{flex:1; font-size:.84rem}
  .xday .dt b{display:block; font-family:var(--display); font-size:.82rem; color:var(--indigo)}
  .xday .dt small{color:var(--ink600); font-size:.74rem}
  .xday .btn{padding:6px 12px; font-size:.76rem}
  .tdy{font-size:.6rem; font-family:var(--display); font-weight:700; background:var(--purple); color:#fff; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:middle}
  .xscore{text-align:center; margin:18px 0}
  .xscore .big{font-family:var(--display); font-weight:700; font-size:2.6rem; color:var(--indigo)}
  .xmiss{margin:12px 0}

/*EXAM_CSS_END*/
</style>
</head>
<body>
<div class="strip"></div>
<div class="modebar"><div class="seg" id="modeSeg"><button data-mode="asana" class="on">Asanas</button><button data-mode="exam">Exam Prep</button></div></div>
<div class="wrap" id="asanaApp">
  <header>
    <h1>Ashtanga Primary Series</h1>
    <div class="sub">Yoga Chikitsa · names · drishti · cues · family / spine / energy</div>
  </header>

  <div class="controls">
    <select id="filter"></select>
    <div class="seg" id="dir">
      <button data-dir="en" class="on">English</button>
      <button data-dir="sa">Sanskrit</button>
    </div>
    <button class="btn" id="shuffle">Shuffle</button>
    <button class="btn" id="hideLearned">Hide learned</button>
  </div>
  <div class="controls" style="margin-top:0">
    <button class="btn primary" id="seqBtn">How to sequence</button>
    <button class="btn primary" id="cueBtn">Cue by family</button>
  </div>

const SEQ_HTML=`
<h3>The arc of a class</h3>
<div class="arc" id="arcChips"></div>
<p>Energy rises to a peak, then settles to rest (the "bell curve"). Ashtanga bakes this in: Sun Salutations build heat, standing work strengthens, seated work goes deep, and the finishing inversions &amp; lotus cool and seal before Savasana. Rough time split: warm-up 15–20% · standing/heat 20–25% · floor &amp; peak 20–25% · cooling 15–20% · Savasana 15–20%.</p>

<h3>Which family goes where — and why</h3>
<p>Three forces decide a family's slot: <b>warmth needed</b> (deeper openers come later), <b>energy</b> (warming/brahmana climbs to the peak, cooling/langhana descends), and <b>spinal direction</b> (leave the spine neutral before loading the opposite direction).</p>
<table class="maptbl">
<tr><th>Family</th><th>Where</th><th>Why</th></tr>
<tr><td><b>Sun Salutation</b></td><td>Open</td><td>Warms the whole body, links breath to movement.</td></tr>
<tr><td><b>Standing</b></td><td>Early</td><td>Most efficient full-body warmer; builds leg/hip strength and the openings later work needs.</td></tr>
<tr><td><b>Balance</b></td><td>End of standing</td><td>Focus &amp; heat are high, fatigue hasn't set in.</td></tr>
<tr><td><b>Core / Arm balance</b></td><td>Mid, near peak</td><td>Core precedes arm balances; teaches the bandha support deeper work needs.</td></tr>
<tr><td><b>Backbend</b></td><td>At the peak</td><td>Most heat-demanding &amp; stimulating; needs a fully warm spine, hips, shoulders.</td></tr>
<tr><td><b>Twist</b></td><td>After backbends</td><td>Re-stabilizes the spine, releases extension, begins the cool-down.</td></tr>
<tr><td><b>Forward bend</b></td><td>Downslope</td><td>Universal neutralizer; cooling; counters the backbends.</td></tr>
<tr><td><b>Hip opener</b></td><td>Late</td><td>Hips open best fully warm; internalizing — sets up sitting for rest.</td></tr>
<tr><td><b>Inversion</b></td><td>Near the end</td><td>Body warm, neck prepared; supported inversions cool &amp; calm. (Headstand is stimulating, shoulderstand calming.)</td></tr>
<tr><td><b>Seated / Rest</b></td><td>Last</td><td>Settle the spine, meditate, then Savasana — always.</td></tr>
</table>

<h3>Counter-pose rules</h3>
<ul>
 <li><b>Forward bend is the universal neutralizer</b> — the hub of the wheel; it resets the spine after almost anything.</li>
 <li><b>Never twist straight off a deep backbend.</b> Neutralize first (gentle forward motion), then twist.</li>
 <li><b>Don't place opposite deep movements back-to-back</b> — put a neutralizer between them.</li>
 <li><b>Counter proportionally</b> — match intensity with a few gentler poses, not one dramatic opposite.</li>
</ul>

<h3>Build a class from a peak pose (4 steps)</h3>
<ul>
 <li><b>1. Pick the peak</b> and analyze what it needs — which joints open, what strengthens, what alignment.</li>
 <li><b>2. Break it into 3–5 component actions.</b></li>
 <li><b>3. Choose prep poses that rehearse each action</b>, ordered simple → complex; the poses just before the peak should mirror it.</li>
 <li><b>4. Peak, then counter-pose &amp; integrate</b> (last ~20–25%), down to Savasana.</li>
</ul>

<h3>Warming vs cooling (brahmana / langhana)</h3>
<p>You can tune the same pose with the breath. <b>Brahmana</b> (energizing) emphasizes the inhale — backbends, standing, Sun Salutations. <b>Langhana</b> (calming) emphasizes the exhale — forward bends, twists, restoratives. <b>Samana</b> (neutral) balances both — Tadasana, Dandasana, Lotus. Ride brahmana up to the peak, langhana down to rest.</p>

<p class="src">Sources: Mark Stephens, <i>Yoga Sequencing</i>; Krishnamacharya/Desikachar (vinyasa krama, brahmana/langhana); Kaminoff, <i>Yoga Anatomy</i>; Yoga International; ACE; Sequence Wiz. Your MRY manual (p.57) supplies the same arc.</p>
`;

const LS="ashtanga_learned_v3";
let learned=new Set(JSON.parse(localStorage.getItem(LS)||"[]"));
let dir="en", hideLearned=false, filterVal="all", order=[], pos=0;
const $=id=>document.getElementById(id);
const card=$("card");
const key=c=>c.sa;

// build filter dropdown (grouped)
(function(){
  const sel=$("filter");
  sel.innerHTML="";
  const all=document.createElement("option"); all.value="all"; all.textContent="All poses"; sel.appendChild(all);
  const gF=document.createElement("optgroup"); gF.label="Family";
  Object.entries(FAM).forEach(([k,v])=>{if(DECK.some(c=>c.f===k)){const o=document.createElement("option");o.value="f:"+k;o.textContent=v.label;gF.appendChild(o);}});
  sel.appendChild(gF);
  const gS=document.createElement("optgroup"); gS.label="Spinal action";
  Object.entries(SPINE).forEach(([k,v])=>{if(DECK.some(c=>c.sp===k)){const o=document.createElement("option");o.value="sp:"+k;o.textContent=v;gS.appendChild(o);}});
  sel.appendChild(gS);
  const gE=document.createElement("optgroup"); gE.label="Energy";
  Object.entries(ENERGY).forEach(([k,v])=>{if(DECK.some(c=>c.e===k)){const o=document.createElement("option");o.value="e:"+k;o.textContent=v.l;gE.appendChild(o);}});
  sel.appendChild(gE);
})();

function match(c){
  if(filterVal==="all")return true;
  const [dim,val]=filterVal.split(":");
  return (dim==="f"&&c.f===val)||(dim==="sp"&&c.sp===val)||(dim==="e"&&c.e===val);
}
function buildOrder(){
  order=DECK.map((c,i)=>i).filter(i=>{const c=DECK[i]; if(!match(c))return false; if(hideLearned&&learned.has(key(c)))return false; return true;});
  if(order.length===0)order=DECK.map((c,i)=>i);
  pos=0;
}
function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]];}pos=0;}

function render(){
  card.classList.remove("flipped");
  const c=DECK[order[pos]], fam=FAM[c.f], col=fam.c;
  card.querySelector(".front").style.setProperty("--cat",col);
  card.querySelector(".back").style.setProperty("--cat",col);
  $("fTag").textContent=$("bTag").textContent=fam.label;
  $("fTag").style.background=$("bTag").style.background=col;
  $("fNum").textContent=$("bNum").textContent=(pos+1)+" / "+order.length;
  const en=dir==="en";
  $("fPrime").textContent=en?c.en:c.sa;
  $("fPrime").className="prime"+(en?"":" sa");
  $("fPron").textContent=en?"":c.pron;
  $("fRole").textContent=c.role;
  const photo=PHOTO[c.sa];
  if(photo){
    $("fFig").innerHTML=`<img class="poseimg" src="assets/poses/${photo}" alt="${c.en}" loading="lazy">`;
    $("bFig").innerHTML=`<img class="poseimg sm" src="assets/poses/${photo}" alt="">`;
  }else{
    $("fFig").innerHTML=`<div class="noimg">image coming soon</div>`;
    $("bFig").innerHTML=`<div class="noimg sm">—</div>`;
  }
  $("bSanskrit").textContent=c.sa;
  $("bEng").textContent=c.en+"  ·  "+c.pron;
  $("bLens").innerHTML=
    `<span class="chip"><span class="dot" style="background:${col}"></span>${fam.label}</span>`+
    `<span class="chip">${SPINE[c.sp]}</span>`+
    `<span class="chip"><span class="dot" style="background:${ENERGY[c.e].v}"></span>${ENERGY[c.e].l}</span>`;
  $("bTrans").textContent=c.tr; $("bDrishti").textContent=c.dr; $("bBreath").textContent=c.br; $("bRole").textContent=c.role; $("bCue").textContent=c.cue;
  const isL=learned.has(key(c));
  $("learn").classList.toggle("on",isL);
  $("learn").textContent=isL?"✓ Learned":"Mark learned";
  const total=DECK.length,done=DECK.filter(c=>learned.has(key(c))).length;
  $("pbar").style.width=(done/total*100)+"%";
  $("plabel").innerHTML=`<b>${done}</b> of ${total} learned · card ${pos+1} of ${order.length} in view`;
}
function go(d){pos=(pos+d+order.length)%order.length;render();}
function toggleLearned(){const c=DECK[order[pos]],k=key(c); if(learned.has(k))learned.delete(k);else learned.add(k); localStorage.setItem(LS,JSON.stringify([...learned])); if(hideLearned){buildOrder();render();}else render();}

function openSeq(){
  $("sheetTitle").textContent="How to sequence";
  $("sheetBody").innerHTML=SEQ_HTML;
  const chips=$("arcChips");
  const arc=[["Center","rest"],["Warm","sun"],["Build","standing"],["Peak","backbend"],["Descend","twist"],["Cool","forward"],["Invert","inversion"],["Rest","rest"]];
  arc.forEach(([n,f],i)=>{const s=document.createElement("span");s.textContent=n;s.style.background=FAM[f].c;chips.appendChild(s); if(i<arc.length-1){const a=document.createElement("i");a.textContent="→";chips.appendChild(a);}});
  $("overlay").classList.add("open");
}
function openCue(){
  $("sheetTitle").textContent="Cue by family";
  let html="<p>Every family has a governing principle, its signature cues, and one joint to protect. Entry cues pair to the breath: <b>inhale to lengthen/lift, exhale to fold/deepen/twist.</b></p>";
  Object.entries(FAM).forEach(([k,v])=>{
    if(!CUEFAM[k]||!DECK.some(c=>c.f===k))return;
    const g=CUEFAM[k];
    html+=`<div class="fam" style="--fc:${v.c}"><h4>${v.label}</h4><p class="pr">${g.pr}</p><ul>`+
      g.cues.map(x=>`<li>${x}</li>`).join("")+`</ul><div class="guard"><b>Protect:</b> ${g.guard}</div></div>`;
  });
  html+=`<p class="src">Sources: Yoga Journal, Yoga International, Jason Crandell, Mark Stephens, Ghosh Yoga, Ekhart Yoga, Brett Larkin. Breath-led cue style per the Ashtanga method.</p>`;
  $("sheetBody").innerHTML=html;
  $("overlay").classList.add("open");
}

card.onclick=()=>card.classList.toggle("flipped");
$("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1); $("learn").onclick=toggleLearned;
$("shuffle").onclick=()=>{shuffle();render();};
$("filter").onchange=function(){filterVal=this.value;buildOrder();render();};
$("hideLearned").onclick=function(){hideLearned=!hideLearned;this.textContent=hideLearned?"Show all":"Hide learned";buildOrder();render();};
$("seqBtn").onclick=openSeq; $("cueBtn").onclick=openCue;
$("closeSheet").onclick=()=>$("overlay").classList.remove("open");
$("overlay").onclick=e=>{if(e.target===$("overlay"))$("overlay").classList.remove("open");};
document.querySelectorAll("#dir button").forEach(b=>b.onclick=function(){document.querySelectorAll("#dir button").forEach(x=>x.classList.remove("on"));this.classList.add("on");dir=this.dataset.dir;render();});
document.addEventListener("keydown",e=>{
  if(window.MODE==="exam")return;
  if($("overlay").classList.contains("open")){if(e.key==="Escape")$("overlay").classList.remove("open");return;}
  if(e.code==="Space"){e.preventDefault();card.classList.toggle("flipped");}
  else if(e.key==="ArrowLeft")go(-1); else if(e.key==="ArrowRight")go(1);
  else if(e.key.toLowerCase()==="l")toggleLearned(); else if(e.key.toLowerCase()==="s"){shuffle();render();}
});
window.showPose=function(sa){ if(window.setMode)window.setMode("asana"); filterVal="all"; $("filter").value="all"; buildOrder(); const i=DECK.findIndex(c=>c.sa===sa); if(i>=0){const k=order.indexOf(i); pos=k<0?0:k;} render(); window.scrollTo(0,0); };
buildOrder();render();
</script>

<script>
/*EXAM_DATA_START*/
const EXAM={"topics": [{"id": "ashtanga", "name": "Ashtanga Yoga"}, {"id": "ancient", "name": "Ancient Texts"}, {"id": "history", "name": "Modern History of Yoga"}, {"id": "breath", "name": "Breath and Meditation"}, {"id": "anatomy", "name": "Anatomy"}, {"id": "energetic", "name": "Energetic Anatomy"}, {"id": "sanskrit", "name": "Sanskrit"}, {"id": "teaching", "name": "Teaching Methodology"}, {"id": "beginners", "name": "Beginners"}, {"id": "sequencing", "name": "Creative Sequencing"}], "items": [{"topic": "ashtanga", "type": "recall", "q": "Define parampara.", "a": "Parampara is the traditional transmission of yoga knowledge through an unbroken lineage, from guru to student. In Ashtanga, postures are done with correct alignment and proper guidance by a guru following parampara; the teacher guides the student through psychological/physical blocks (granthis/samskaras) so they don't waver from the path. (MRY Manual, Ashtanga/Tristana)", "w": false, "mytype": false, "flag": false, "id": "003", "ord": 0, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 45, "q": "Postures should be done with correct alignment and proper guidance by a guru"}], "fix": "Manual only gives: postures are done with correct alignment and proper guidance by a guru following parampara (p.45, with Kino MacGregor quote on teacher guiding students through granthis/psychological blocks). The wording 'unbroken lineage from guru to student' is not in the materials.", "note": "Searched all 5 files for parampara; only manual p.45 uses the word; no one-line definition (Weekend 1 study Q5 p.66 asks it but gives no answer)."}}, {"topic": "ashtanga", "type": "recall", "q": "List and explain the 3 bandhas practiced in the Ashtanga method.", "a": "Bandha = “lock/seal” — activating isolated muscle groups to control the flow of prana; all three together = Maha Bandha (the Great Bandha). (1) UDDIYANA bandha (belly lock): ~2 in. below the navel, drawn toward the spine with a soft upper abdomen — lifts the lower belly for core strength and lightness. (2) MULA bandha (root lock): base of the spine — a firm lift of the pelvic floor at the perineum. (3) JALANDHARA bandha (chin lock): chin extends forward then draws back toward the throat where the clavicles meet. (MRY Manual p.45)", "w": false, "mytype": false, "flag": false, "id": "005", "ord": 1, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 45, "q": "When all three locks are engaged, this is called “Maha Bandha” or “The Great Bandha.”"}, {"f": "manual", "p": 45, "q": "Uddiyana bandha (the belly lock) is located about 2 inches below the belly button."}, {"f": "manual", "p": 45, "q": "Jalandhara bandha (the chin lock) is per- formed by extending the chin forward and drawing it back toward the throat where the clavicle bones meet."}], "fix": null, "note": "Draft matches p.45 (mula = firm lifting of pelvic floor at the perineum; p.47 glossary also lists Jalandhara throat lock, Mula root lock, Uddiyana upward-flying lock)."}}, {"topic": "ashtanga", "type": "recall", "q": "What is tristana?", "a": "The Tristana method is the union of three elements of Ashtanga (per Sri K. Pattabhi Jois): BREATH (ujjayi), DRISTHI (gaze), and POSTURE (asana). They are the three points of attention held at all times, purifying Spirit (breath), Mind (dristhi) and Body (posture), and are always performed together. (MRY Manual p.44)", "w": false, "mytype": false, "flag": false, "id": "007", "ord": 2, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 44, "q": "The Tristana method describes the union of three con - stituent elements of Ashtanga yoga, as detailed by its founder, the late Sri K. Pattabhi Jois: Breath, Dristhi, and Posture."}], "fix": null, "note": "Page 44 confirmed; p.44 also says they purify Spirit (breath), Mind (dristhi) and Body (posture)."}}, {"topic": "ashtanga", "type": "recall", "q": "What are the 8 limbs of Ashtanga Yoga? List in Sanskrit and define in English.", "a": "Ashta=eight, anga=limb (Patanjali's eightfold path): 1) YAMA – social ethics/restraints; 2) NIYAMA – personal ethics/observances; 3) ASANA – posture, seat; 4) PRANAYAMA – breath/prana control; 5) PRATYAHARA – withdrawal of the senses; 6) DHARANA – focus/concentration; 7) DHYANA – meditation (uninterrupted focus); 8) SAMADHI – complete absorption/bliss. (MRY Manual, The Eight Limbs, p.71–74)", "w": false, "mytype": false, "flag": false, "id": "009", "ord": 3, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 47, "q": "Yama: Social ethics; restraints Niyama: Personal ethics; internal restraints Asana: Posture, seat Pranayama: Prana control/breath work"}, {"f": "manual", "p": 74, "q": "Patanjali describes this eighth and ﬁnal stage of ashtanga, samadhi, as a state of ecstasy."}], "fix": null, "note": "Definitions match p.47 glossary and p.73-74 article; draft cites p.71-74 (actual article is PDF pp.73-74; p.72 is a divider)."}}, {"topic": "ashtanga", "type": "recall", "q": "Define namaste.", "a": "[Not given as a one-line definition in the manual — the manual discusses Namaste culturally and as bringing the palms together to reflect on one's motivation before practice.] Commonly taught: a respectful greeting with palms together (Anjali) — “the light/divine in me honors the light/divine in you.” (CONFIRM with class notes.)", "w": false, "mytype": false, "flag": true, "id": "011", "ord": 4, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 87, "q": "They are now ready to bring their hands into Namaste po-"}, {"f": "manual", "p": 88, "q": "sition and reﬂect on their motivation before beginning their practice."}, {"f": "manual", "p": 39, "q": "Namah/ namas: I Salute/ I bow"}], "fix": "No one-line definition exists in the materials. Closest: Namaste = hands brought together (prayer position) to reflect on one's motivation before practice (p.87-88); the root 'namah/namas' is glossed 'I Salute / I bow' (p.39, Surya Namaskara). The 'light in me honors the light in you' wording is NOT in the materials. Weekend 2 study Q4 (p.100) asks 'Define Namaste' without an answer.", "note": "Searched manual/history/pranayama/guru/mrityunjaya for namaste/namah/namas; the draft's NOT-given-as-definition flag is correct."}}, {"topic": "ashtanga", "type": "recall", "q": "Define moksha.", "a": "[Not found in the provided manual text.] Standard meaning: liberation — spiritual release/freedom from the cycle of birth and death (samsara). (CONFIRM with class notes.)", "w": false, "mytype": false, "flag": true, "id": "013", "ord": 5, "check": {"v": "SUPPORTED", "ev": [{"f": "pranayama", "p": 34, "q": "The goal of Indian religions is to escape this process, the achievement of which is calledmoksha."}, {"f": "pranayama", "p": 35, "q": "The liberation fromSaṃsārais calledMoksha,Nirvana, Mukti or Kaivalya."}, {"f": "history", "p": 11, "q": "introspection, and the concept of liberation (moksha)."}], "fix": "Moksha = liberation from samsara (the endless cycle of birth, death, rebirth); also called Nirvana, Mukti, Kaivalya (pranayama deck p.34-35). The draft's 'not found' is wrong, but its standard meaning matches.", "note": "Found in pranayama.txt (Hawah Kasat slides) and history.txt; not in the manual itself."}}, {"topic": "ashtanga", "type": "recall", "q": "List and explain the yamas and niyamas in Sanskrit and English. Briefly describe, as a whole, their relevance in yoga practice, both on and off the mat.", "a": "YAMAS (restraints / social ethics): Ahimsa – nonviolence; Satya – truthfulness; Asteya – nonstealing; Brahmacharya – continence/moderation; Aparigraha – noncovetousness. NIYAMAS (observances / personal ethics): Saucha – cleanliness; Samtosa – contentment; Tapas – heat/discipline; Svadhyaya – study of sacred scripture and of oneself; Isvara pranidhana – surrender to God. RELEVANCE: as the first two limbs they are guidelines for a meaningful, purposeful life — moral/ethical conduct and self-discipline. They apply both ON the mat (how we practice) and OFF the mat (how we live and treat others — the “Golden Rule”), forming the ethical foundation of the whole practice. (MRY Manual p.72–73)", "w": false, "mytype": false, "flag": false, "id": "015", "ord": 6, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 73, "q": "Ahimsa: nonviolence Satya: truthfulness Asteya: nonstealing Brahmacharya: continence Aparigraha: noncovetousness"}, {"f": "manual", "p": 73, "q": "Isvara pranidhana: surrender to God"}, {"f": "manual", "p": 73, "q": "Yamas are universal prac- tices that relate best to what we know as the Golden Rule"}], "fix": null, "note": "All ten terms and glosses match p.73; draft cites p.72-73 (PDF p.73). Relevance on/off the mat is partly the teacher's own synthesis (p.73 'meaningful and purposeful life' / 'moral and ethical conduct and self-discipline'; teaching articles pp.96-98)."}}, {"topic": "ancient", "type": "recall", "q": "Define sutra. Who compiled, and how books make up, the Yoga Sutras?", "a": "SUTRA means “thread” — the sutras are brief phrases/aphorisms that work to define yoga. The Yoga Sutras were COMPILED BY PATANJALI and are divided into FOUR books (padas): consciousness, practice, powers, and liberation. (The eight limbs are mentioned in the second book.) (MRY Manual, Sacred Texts)", "w": false, "mytype": false, "flag": false, "id": "018", "ord": 0, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 78, "q": "Sutra means thread. The sutras are brief phrases that work to deﬁne yoga"}, {"f": "manual", "p": 78, "q": "The Sutra is divided into four books: consciousness, practice, powers, and liberation"}, {"f": "manual", "p": 78, "q": "Aphorisms on yoga compiled by Patanjali"}], "fix": null, "note": "Matches p.78 exactly; eight limbs in second book also on p.78."}}, {"topic": "ancient", "type": "recall", "q": "Define upanishad.", "a": "Upanishad = “to sit near/with the teacher.” The Upanishads are commentaries on the Vedas that explain in detail one's relationship to all things — the concept that the entire universe can be studied and found within oneself; they contain many references to yoga, yogic techniques and meditation. (MRY Manual, Sacred Texts)", "w": false, "mytype": false, "flag": false, "id": "020", "ord": 1, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 78, "q": "“To sit near/with the teacher”"}, {"f": "manual", "p": 78, "q": "Commentaries on the Vedas"}, {"f": "manual", "p": 78, "q": "Concept that the entire universe can be studied and found within oneself"}], "fix": null, "note": "Matches p.78."}}, {"topic": "ancient", "type": "recall", "q": "Define atma, para-atma, and explain the mudra that connects them.", "a": "The mudra the manual names here is GYAN MUDRA. Atma = the individual self/soul; Para-Atma = the supreme/universal Self (the manual refers to Atman as “the Self” in the pancha-kosha material). Gyan (jnana) mudra joins the tip of the index finger (the individual self, atma) to the thumb (the universal Self, para-atma), symbolizing their union. [Manual supplies the term “Gyan Mudra” and “Atman = Self”; the fuller atma/para-atma explanation is standard — confirm with class.]", "w": false, "mytype": false, "flag": true, "id": "022", "ord": 2, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 101, "q": "•Atma •Para-Atma •Gyan Mudra"}, {"f": "history", "p": 37, "q": "Our individual \"Self\" (Atman) is part of the \"Universal Whole\" (Brahman)."}, {"f": "history", "p": 43, "q": "elaborate on how the soul (Atman) can be united with the ultimate truth (Brahman or Paramatman) through contemplation and meditation"}], "fix": "Atma/Atman = the individual Self/soul; Para-atma = Paramatman = Brahman, the ultimate truth/universal whole (history deck pp.11, 37, 43). Mudra = Gyan Mudra (the manual's Weekend 2 study Q12, p.101, lists 'Atma / Para-Atma / Gyan Mudra'). The manual only labels Gyan Mudra in the p.76 drawing (alongside Vishnu and Anjali mudras); no text states it joins index finger (atma) to thumb (para-atma) - that symbolism is standard but not in the materials.", "note": "p.76 is an image page (viewed rendered); searched all text files for atma/atman/paramatma/gyan/jnana. Note 'Para-Atma' spelled 'Paramatman' in history deck p.43."}}, {"topic": "history", "type": "recall", "q": "Who are the 2 most well-known lineages of Krishnamacharya’s yoga and what schools of yoga are affiliated with them?", "a": "Sri K. PATTABHI JOIS → ASHTANGA (Vinyasa) Yoga; and B.K.S. IYENGAR → IYENGAR Yoga. (Both stem from Krishnamacharya. Others in his legacy: Indra Devi; T.K.V. Desikachar / Viniyoga.) (MRY Manual, Krishnamacharya's Legacy)", "w": false, "mytype": false, "flag": false, "id": "025", "ord": 0, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 80, "q": "Whether you practice the dynamic series of Pattabhi Jois, the reﬁned alignments of B.K.S. Iyengar, the classical pos- tures of Indra Devi, or the customized vinyasa of Viniyoga"}, {"f": "manual", "p": 82, "q": "Ashtanga Vinyasa Yoga. As Krishnamacharya's pupils"}], "fix": null, "note": "Pattabhi Jois -> Ashtanga (Vinyasa); B.K.S. Iyengar -> Iyengar Yoga. Manual p.80 actually names four (also Indra Devi, Viniyoga/Desikachar); p.80 'Iyengar, Ashtanga, or Viniyoga lineages'. Draft cites a section called 'Krishnamacharya's Legacy', which is the article title on p.79."}}, {"topic": "history", "type": "recall", "q": "Who is the renowned female student of Krishnamacharya?", "a": "INDRA DEVI. (MRY Manual, Krishnamacharya's Legacy / Modern History)", "w": false, "mytype": false, "flag": false, "id": "027", "ord": 1, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 83, "q": "The woman, who became known as Indra Devi (she was born Zhenia Labunskaia, in pre-Soviet Latvia)"}], "fix": null, "note": "Matches p.83; Weekend 2 study Q20 (p.103) asks for the 'most noted female student'."}}, {"topic": "breath", "type": "recall", "q": "Define the 4 parts of the breath.", "a": "Inhalation – PURAKA; retention/hold after the inhale – ANTARA KUMBHAKA; exhalation – RECHAKA; retention/hold after the exhale – BAHYA KUMBHAKA. [The pranayama reading defines pranayama as “the regulation of the inhalation and exhalation and the suspension of the breath, and the modulation of its length and pressure” (Patanjali). The four Sanskrit labels are the standard terminology for those parts — confirm exact labels with class.]", "w": false, "mytype": false, "flag": true, "id": "030", "ord": 0, "check": {"v": "NOT_FOUND", "ev": [{"f": "manual", "p": 104, "q": "24.What are the four parts of breath and deﬁne each one?"}], "fix": "The materials never name or define the four parts. Study question only (manual p.104 Q24, blank). Puraka/antara kumbhaka/rechaka/bahya kumbhaka are standard terminology but do not appear; the only related text is manual p.89 'breath retention (kumbak)' and pranayama deck p.6 (Patanjali: 'regulation of the inhalation and exhalation and the suspension of the breath').", "note": "Searched all files for puraka/pooraka/rechaka/recaka/kumbhaka/kumbak/antara/bahya/'four parts'. Draft's own caveat is correct."}}, {"topic": "breath", "type": "recall", "q": "What is pranayama?", "a": "Pranayama = prana (life force) + yama (restraint; with a long “a,” also “to free”) — the conscious regulation, restraining and setting-free of prana through breath control. Patanjali: the regulation of inhalation, exhalation and suspension of the breath and the modulation of its length and pressure. It is the 4th of the eight limbs and calms/harmonizes the mind in preparation for meditation. (Hawah – Pranayama)", "w": false, "mytype": false, "flag": false, "id": "032", "ord": 1, "check": {"v": "SUPPORTED", "ev": [{"f": "pranayama", "p": 6, "q": "Defined by Patanjali as the regulation of the inhalation and exhalation and the suspension of the breath as well as the modulation of the length and pressure."}, {"f": "pranayama", "p": 7, "q": "Pranayama = Prana/ Yama = Restraint of Prana."}, {"f": "pranayama", "p": 4, "q": "The 4thof the Eight Limbs"}], "fix": null, "note": "Matches pranayama deck pp.4-8; manual p.73 also gives 'breath control' / literal 'life force extension'."}}, {"topic": "breath", "type": "recall", "q": "Name 3 instructions (the 3 S’s) to prepare students for meditation.", "a": "[Not located in the provided manual/readings — please confirm from class notes. Commonly taught versions use three S's such as Seat (find a steady seat), Spine (lengthen/sit tall & still), Silence — but this was NOT verified in the materials, so do not rely on it.]", "w": false, "mytype": false, "flag": true, "id": "034", "ord": 2, "check": {"v": "NOT_FOUND", "ev": [{"f": "manual", "p": 104, "q": "30.What are three important verbal cues to use when teaching meditation?"}, {"f": "manual", "p": 157, "q": "Make the distinction between a Dharma talk and Meditation."}], "fix": "Not in the materials. The only trace is the blank study question (manual p.104 Q30). Do not use Seat/Spine/Silence as an answer from the course materials.", "note": "Searched every 'meditat' hit in the manual (pp.7-351), plus teaching/Setting the Stage pages 43, 50-56, 157, and the other four files; no list of three S words."}}, {"topic": "anatomy", "type": "mc", "q": "Which movement the hips stretches the hip flexors?", "opts": ["Flexion", "Extension"], "correct": 1, "a": "EXTENSION — hip flexors are stretched when the leg moves back from the pelvis (hip extension). (Anatomy reading)", "flag": false, "marked": true, "id": "037", "ord": 0, "check": {"v": "SUPPORTED", "ev": [{"f": "anatomy-reading", "p": 22, "q": "Hip flexors are stretched with then the leg moves back from the pelvis (hip extension)  [slide 'Hip Flexors', shows psoas, iliacus, sartorius + low lunge photo] (read from the slide image)"}, {"f": "anatomy-reading", "p": 21, "q": "Backbends slide: 'Abdominals and hip flexors must lengthen to enter deep backbends.' (read from the slide image)"}], "fix": null, "note": "Draft wording closely matches the slide; extension is the correct option."}, "draftCorrect": 1}, {"topic": "anatomy", "type": "recall", "q": "Define abduction. Give an example of a posture, cue and body part to support the definition.", "a": "ABDUCTION = moving out and away from the midline. Example — posture: Warrior II (Virabhadrasana II); cue: “reach the arms away from each other / open the legs wide”; body part: arms/legs moving away from midline. (Ellie Clarke – Anatomy; example illustrative.)", "w": false, "mytype": false, "flag": false, "id": "041", "ord": 1, "check": {"v": "PARTIAL", "ev": [{"f": "anatomy-reading", "p": 6, "q": "Abduction: 'Moving out and away' (illustration: arm raised out to the side) (read from the slide image)"}], "fix": "Reading definition is 'Moving out and away' (illustrated by lifting the arm out to the side). It does not say 'midline' and gives no posture/cue example; Warrior II example is the drafter's own.", "note": "Definition supported; posture/cue/body-part example not in the reading or searched manual terms (draft labels it illustrative)."}}, {"topic": "anatomy", "type": "recall", "q": "Define adduction. Give an example of a posture, cue and body part to support the definition.", "a": "ADDUCTION = moving in and toward the midline. Example — posture: Garudasana (Eagle); cue: “cross and hug the thighs/forearms in toward the midline”; body part: legs/arms drawing to midline. (Ellie Clarke – Anatomy; example illustrative.)", "w": false, "mytype": false, "flag": false, "id": "043", "ord": 2, "check": {"v": "PARTIAL", "ev": [{"f": "anatomy-reading", "p": 6, "q": "Adduction: 'Moving in and towards' (illustration: arm lowered toward the body) (read from the slide image)"}], "fix": "Reading definition is 'Moving in and towards' (illustrated by lowering the arm to the body). 'Midline' wording and Garudasana example are not from the reading.", "note": "Definition supported; example is drafter's own (manual mentions Garudasana only for gaze/shoulder stretch, not adduction)."}}, {"topic": "anatomy", "type": "mc", "q": "Which of these connective tissues has nearly zero blood flow?", "opts": ["Muscle", "Tendon", "Ligament"], "correct": 2, "a": "LIGAMENT (ligaments/tendons have very poor blood supply; ligament is the standard answer). [Confirm — the reading lists the three tissues but doesn't state blood flow verbatim.]", "flag": true, "marked": true, "id": "045", "ord": 3, "check": {"v": "NOT_FOUND", "ev": [{"f": "anatomy-reading", "p": 8, "q": "Muscles and Connective Tissue slide: Tendons 'connect muscle to bone'; Ligaments 'connect bone to bone'. No blood-supply statement or table. (read from the slide image)"}], "fix": null, "note": "Reading has only definitions plus a joint diagram; manual groups ligaments/tendons together as drier tissue and says nothing about blood flow, so 'ligament' is an outside-knowledge answer."}, "draftCorrect": 2}, {"topic": "anatomy", "type": "mc", "q": "In seated forward folds, what action should you avoid before taking posture?", "opts": ["Moving the flesh from under the sitz-bones", "Anterior tilt of the pelvis", "Placing a block under the seat", "Engaging uddiyana bandha"], "correct": 3, "a": "Reasoned pick: ENGAGING UDDIYANA BANDHA (a strong belly lock hardens the abdomen and inhibits the forward fold; you should instead draw the flesh from under the sitz-bones, anteriorly tilt, and sit on a block). [Uncertain — confirm the intended answer with class.]", "flag": true, "marked": false, "id": "050", "ord": 4, "check": {"v": "NOT_FOUND", "ev": [], "fix": null, "note": "No 'sitz-bones', 'sit bone' or 'flesh' text anywhere in manual or reading; nothing says to avoid any of the four options, so the draft's uddiyana pick is unsupported (materials, if anything, favor tilt and props as good actions)."}, "draftCorrect": 3}, {"topic": "anatomy", "type": "mc", "q": "Students who have had hip replacements should never do which asana?", "opts": ["Balasana", "Virabhadrasana A", "Garudasana", "Vrksasana"], "correct": 2, "a": "GARUDASANA (Eagle) — deep hip adduction + internal rotation + flexion = highest dislocation risk after a hip replacement. [Standard contraindication — confirm.]", "flag": true, "marked": true, "id": "056", "ord": 5, "check": {"v": "NOT_FOUND", "ev": [], "fix": null, "note": "Neither source mentions hip replacements; Garudasana is plausible clinically but unsupported by the materials (Balasana/Vrksasana/Vira A also not addressed)."}, "draftCorrect": 2}, {"topic": "anatomy", "type": "recall", "q": "What is the best modification for eka pada rajakapotasana or agnistambhasana in order to protect the medial meniscus in the knee?", "a": "Keep the front shin's FOOT FLEXED (dorsiflexed) to stabilize and protect the knee, and do NOT force external rotation of the hip; support the hip with a block/blanket under the sitting bone so the knee isn't torqued. (Anatomy reading: when the foot is fixed while forcing hip external rotation, pressure lands on the inner knee / MCL / medial meniscus.)", "w": false, "mytype": false, "flag": false, "id": "062", "ord": 6, "check": {"v": "PARTIAL", "ev": [{"f": "anatomy-reading", "p": 10, "q": "'When the foot is held in place while forcing external rotation of the hip, the pressure expresses on the inner (medial collateral ligament) of the knee.' (read from the slide image)"}, {"f": "anatomy-reading", "p": 9, "q": "'The medial collateral ligament and medial meniscus are connected which make the inner knee the most fragile in yoga poses' (read from the slide image)"}, {"f": "anatomy-reading", "p": 12, "q": "Tightness in hips slide: seated cross-legged with 'prop top ankle on a block (in front of bottom shin)' and 'rest top knee on block to help relax hip' (read from the slide image)"}, {"f": "manual", "p": 239, "q": "'Pigeon: Place a block, bolster, blanket or rolled up towel under hip'; 'Double Pigeon: Block between knee & ankle'"}], "fix": "Materials support: do not force hip external rotation with the foot fixed; prop with blocks (block under top ankle/knee in double pigeon/fire log, block/blanket under hip in pigeon). 'Keep the foot flexed' is not stated in the reading.", "note": "Mechanism and block/prop modifications supported; the foot-flexed cue is not in either source."}}, {"topic": "anatomy", "type": "recall", "q": "What is the largest low back muscle?", "a": "QUADRATUS LUMBORUM (QL) — the “hip hikers,” connecting the spine to the pelvis. (Ellie Clarke – Anatomy; also MRY Manual)", "w": false, "mytype": false, "flag": false, "id": "064", "ord": 7, "check": {"v": "SUPPORTED", "ev": [{"f": "anatomy-reading", "p": 20, "q": "Slide 'Largest Low Back Muscle': 'Quadratus Lumborum \"Hip Hikers\"' (image of QL between ribs and pelvis) (read from the slide image)"}], "fix": null, "note": "Reading names QL (not erector spinae, which appears only as a label in the back-muscle diagram p19); manual p111 mentions QL activation but not 'largest'."}}, {"topic": "anatomy", "type": "recall", "q": "How many cervical vertebrae are there?", "a": "SEVEN (7). [Standard anatomy — shown in the reading's spine diagram.]", "w": false, "mytype": false, "flag": false, "id": "066", "ord": 8, "check": {"v": "SUPPORTED", "ev": [{"f": "anatomy-reading", "p": 19, "q": "The Spine diagram: 'Cervical vertebrae numbered from C1 to C7' (thoracic T1-T12, lumbar L1-L5, sacral) (read from the slide image)"}], "fix": null, "note": "C1 to C7 = 7."}}, {"topic": "anatomy", "type": "mc", "q": "Which part of the spine has the least range of movement? And why?", "opts": ["Cervical", "Thoracic", "Lumbar"], "correct": 1, "a": "THORACIC — because the ribs attach to the thoracic vertebrae, so the rib cage restricts movement, giving it the least range of motion. [Standard anatomy.]", "flag": false, "marked": true, "id": "068", "ord": 9, "check": {"v": "NOT_FOUND", "ev": [{"f": "anatomy-reading", "p": 19, "q": "Spine slide only labels cervical C1-C7, thoracic T1-T12, lumbar L1-L5; p7 shows spine flexion/extension/lateral flexion; no statement on which region moves least (read from the slide image)"}], "fix": null, "note": "Thoracic (ribs) is standard anatomy but is not stated in the course materials."}, "draftCorrect": 1}, {"topic": "anatomy", "type": "match", "q": "Match the directions:", "pairs": [["Anterior", "Front"], ["Posterior", "Back"], ["Inferior", "Below"], ["Medial", "Toward center"], ["Distal", "Further away"], ["Lateral", "Away from center"], ["Proximal", "Closer."]], "a": "Anterior = Front; Posterior = Back; Inferior = Below; Medial = Toward center; Distal = Further away; Lateral = Away from center; Proximal = Closer. (Also: Superior = Above.) (Ellie Clarke – Anatomy, directional-terms table)", "flag": false, "id": "073", "ord": 10, "check": {"v": "SUPPORTED", "ev": [{"f": "anatomy-reading", "p": 4, "q": "Directional Terms table: Anterior=Front; Posterior=Back; Superior=Above; Inferior=Below; Medial=Towards center; Lateral=Away from center; Distal=Further away; Proximal=Closer (read from the slide image)"}, {"f": "anatomy-reading", "p": 4, "q": "'Proximal is closer to the center or whatever the point of reference. Distal is further from the center...' (read from the slide image)"}], "fix": null, "note": "All seven draft pairings match the table; also p2-p3 show superior/inferior, anterior/posterior, medial/lateral slides."}}, {"topic": "energetic", "type": "recall", "q": "What is a nadi and what flows through the nadis?", "a": "A NADI is an energy channel/pathway in the subtle body; PRANA (life-force energy) flows through the nadis. (MRY Manual, energetic anatomy)", "w": false, "mytype": false, "flag": false, "id": "083", "ord": 0, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 167, "q": "In India, yogis called this energy prana and its pathways nadis"}, {"f": "manual", "p": 183, "q": "the energy channels or nadis"}], "fix": null, "note": "Draft matches (nadi = energy channel/pathway; prana flows through)."}}, {"topic": "energetic", "type": "recall", "q": "What is kundalini?", "a": "Kundalini is the dormant spiritual energy pictured as a sleeping serpent goddess coiled at the base of the first (root) chakra; when awakened she spirals up the energy channels (nadis), piercing each chakra and bringing successively higher states of awareness, culminating in enlightenment at the crown chakra. (MRY Manual)", "w": false, "mytype": false, "flag": false, "id": "085", "ord": 1, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 207, "q": "She coils around the base of the ﬁrst chakra and, when awakened, spirals up the en- ergy channels (nadis) and pierces each chakra"}], "fix": null, "note": "Draft is a near-verbatim paraphrase of p.207 (sleeping serpent goddess, culminating in enlightenment at the crown chakra)."}}, {"topic": "energetic", "type": "recall", "q": "Describe each of the 3 main nadis.", "a": "IDA – the left channel; the cool, lunar, feminine (shakti) current. PINGALA – the right channel; the hot, solar, masculine current. SUSHUMNA – the central channel along the spine, where the union of ida and pingala takes place (the awakening of higher consciousness). (MRY Manual – Hatha Yoga Pradipika)", "w": false, "mytype": false, "flag": false, "id": "087", "ord": 2, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 89, "q": "the shakti, or female, cool current which travels through the ida nadi, and the mind, or male, hot current which travels through the pin- gala nadi."}, {"f": "manual", "p": 89, "q": "When their union takes place in the central channel (sushumna nadi) it is the union of body and mind"}, {"f": "pranayama", "p": 23, "q": "Left Nostril •Ida Nadi –"}], "fix": null, "note": "Left/right assignment comes from pranayama deck pp.23-24 (Ida left nostril, cool, feminine; Pingala right, hot, sun, masculine); 'along the spine' is not stated in text but p.76 diagram shows all three on the spine."}}, {"topic": "sanskrit", "type": "recall", "q": "Translate yogas citta vrtti nirodhah into English.", "a": "“Yoga is the stilling (cessation/restraint) of the fluctuations/modifications of the mind.” Found in Patanjali's Yoga Sutras, Book 1 (Samadhi Pada), Sutra 1.2.", "w": false, "mytype": false, "flag": false, "id": "090", "ord": 0, "check": {"v": "SUPPORTED", "ev": [{"f": "history", "p": 67, "q": "Yogas Citta Vrtti Nirodhah (1:2) Yoga is the removing of the fluctuations of themind/ consciousness."}], "fix": null, "note": "Course slide gives Sutra 1:2 and 'removing of the fluctuations of the mind/consciousness' (p.68 also 'stilling of the mind'). Draft's 'Book 1 (Samadhi Pada)' is outside the materials but correct."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Warrior 1", "answer": "Virabhadrasana A (Vira I)", "flag": false, "id": "093", "ord": 1, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 338, "q": "Virabhadrasana A (Right Side - 5 Breaths) Warrior 1"}], "fix": null, "note": "Manual uses Virabhadrasana A (also p.345, p.364)."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Upward facing dog", "answer": "Urdhva Mukha Svanasana", "flag": false, "id": "094", "ord": 2, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 40, "q": "Urdhva Mukha Svanasana Upward Facing Dog"}], "fix": null, "note": "p.40 (also p.63 'Urdhva Mukha Svanasana (Upward-Facing Dog Pose)')."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Hand to foot", "answer": "Padangusthasana / Hasta Padangusthasana", "flag": false, "id": "095", "ord": 3, "check": {"v": "CONTRADICTED", "ev": [{"f": "manual", "p": 338, "q": "Padangusthasana (5 Breaths) Hand to Big Toe Pose Padahastasana (5 Breaths) Hand to Foot Pose"}, {"f": "manual", "p": 345, "q": "Padahastasana Foot to Hand Posture"}], "fix": "Padahastasana (the manual spells it Padahasthasana)", "note": "Confirmed on pp.338, 343, 345; draft's Padangusthasana / Hasta Padangusthasana is wrong for 'Hand to foot'."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Staff", "answer": "Dandasana", "flag": false, "id": "096", "ord": 4, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 345, "q": "Dandasana Staff Posture"}], "fix": null, "note": "p.345 Ashtanga Primary Series list."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Garland", "answer": "Malasana", "flag": false, "id": "097", "ord": 5, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 388, "q": "Garland Posture"}, {"f": "manual", "p": 339, "q": "Malasana (5 Breaths) Yogic Squat"}], "fix": null, "note": "Manual's posture page p.388 glosses Malasana as 'Garland Posture' (Signature Sequence p.339 calls it 'Yogic Squat')."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Wide-legged forward fold", "answer": "Prasarita Padottanasana", "flag": false, "id": "098", "ord": 6, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 392, "q": "Wide-Legged Forward Bend A"}, {"f": "manual", "p": 339, "q": "Prasarita Padottanasana A (5 Breaths) Wide Angle Forward Bend A"}], "fix": null, "note": "Manual spells it Prasarita Padottanasana (p.392); Wide-Legged Forward Bend on posture pages."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Revolved chair", "answer": "Parivrtta Utkatasana", "flag": false, "id": "099", "ord": 7, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 338, "q": "Parivrtta Utkatasana (Right Side - 5 Breaths) Revolved Chair"}], "fix": null, "note": "p.338-339."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Tree", "answer": "Vrksasana", "flag": false, "id": "100", "ord": 8, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 339, "q": "Vrksasana (Right and Left Side - 5 Breaths) Tree Pose"}], "fix": null, "note": "p.339."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Dancer", "answer": "Natarajasana", "flag": false, "id": "101", "ord": 9, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 339, "q": "Natarajasana (Right and Left Side - 5 Breaths) Dancer Pose"}], "fix": null, "note": "p.339."}}, {"topic": "sanskrit", "type": "pair", "sub": "posture", "label": "Translate into Sanskrit", "prompt": "Child’s", "answer": "Balasana", "flag": false, "id": "102", "ord": 10, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 340, "q": "Balasana (5 Breaths) Child’s Pose"}], "fix": null, "note": "p.340."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Side", "answer": "Parsva", "flag": false, "id": "104", "ord": 11, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Parsva: Side"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Half", "answer": "Ardha", "flag": false, "id": "105", "ord": 12, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Ardha: Half"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Downward", "answer": "Adho", "flag": false, "id": "106", "ord": 13, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Adho: Downward"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Extended", "answer": "Utthita", "flag": false, "id": "107", "ord": 14, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Utthita: Extended"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Supported", "answer": "Salamba", "flag": false, "id": "108", "ord": 15, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Salamba: Supported"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Supine", "answer": "Supta", "flag": false, "id": "109", "ord": 16, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Supta: Supine"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Reverse", "answer": "Viparita", "flag": false, "id": "110", "ord": 17, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 338, "q": "Viparita Virabhadrasana (Right Side - 5 Breaths) Reverse Warrior"}, {"f": "manual", "p": 48, "q": "Viparita: Inverted"}], "fix": "Viparita (the glossary glosses it 'Inverted'; manual uses it for 'Reverse' in Viparita Virabhadrasana = Reverse Warrior, p.338).", "note": "Draft's Viparita is right for 'Reverse' per the manual's own posture naming, but the glossary on p.48 says 'Inverted'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Revolved", "answer": "Parivrtta", "flag": false, "id": "111", "ord": 18, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Parivrtta: Revolved"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors' (glossary also has Parivartana: Revolving)."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Spread", "answer": "Prasarita", "flag": false, "id": "112", "ord": 19, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Prasarita: Spread"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "sanskrit", "type": "pair", "sub": "direction", "label": "Translate the direction word into Sanskrit", "prompt": "Bound", "answer": "Baddha", "flag": false, "id": "113", "ord": 20, "check": {"v": "SUPPORTED", "ev": [{"f": "manual", "p": 48, "q": "Baddha: Bound"}], "fix": null, "note": "Sanskrit Fundamentals glossary p.48, 'Directives/Actions/Descriptors'."}}, {"topic": "teaching", "type": "recall", "q": "Name and describe the 3 personality types of yoga students. Indicate which one(s) you are.", "a": "The manual's three personality/constitution types are the DOSHAS: VATA (air/ether) – slim, light, quick, creative, restless, changeable; anxious/worried under stress. PITTA (fire/water) – medium/muscular, sharp intellect, focused and driven; irritable/angry under stress. KAPHA (earth/water) – larger, strong, steady, calm, grounded; slow to change, can be complacent/attached. (MRY Manual – Dosha section.) → Which one(s) you are: ________ (self-identify; most people are a blend).", "w": false, "mytype": true, "flag": false, "id": "115", "ord": 0, "check": {"v": "CONTRADICTED", "ev": [{"f": "manual", "p": 54, "q": "Consider the Athlete, the Scientist, and the Mystic:"}, {"f": "manual", "p": 54, "q": "Who Are You? The 3 Yogi Archeytpes"}], "fix": "The three types are the 3 Yogi Archetypes: ATHLETE (interested in working hard, sweating, performance; motivated by high energy, 'Go, go, go', positive affirmation, the 'how'), SCIENTIST (precision, evidence, logic; motivated by accuracy, numbers, literal language, the 'why'), MYSTIC (spiritual/metaphysical, less tangible rewards; motivated by colorful/metaphorical language, connection, energetic body). NOT the doshas.", "note": "p.54 table; doshas (Vata/Pitta/Kapha, pp.194, 214-216) are a separate topic (Weekend 3 study Q11-12). 'Which one(s) you are' is self-answer."}}, {"topic": "teaching", "type": "recall", "q": "List 3 cues to instruct students to use ujjayi pranayama.", "a": "(1) Breathe in and out through the NOSE (mouth closed). (2) Gently CONSTRICT/narrow the back of the throat (the glottis). (3) Create a soft, audible “OCEAN” sound — like fogging a mirror or a whisper — so the breath is “deep breathing with sound” (the Victorious Breath). (MRY Manual defines ujjayi as deep breathing with sound; cues are standard technique.)", "w": true, "mytype": false, "flag": false, "id": "117", "ord": 1, "check": {"v": "PARTIAL", "ev": [{"f": "manual", "p": 44, "q": "Ujjayi Pranayama or ”The Victorious Breath” can easily be deﬁned as deep breathing with sound"}, {"f": "manual", "p": 33, "q": "Breathe through your nose with lips sealed."}, {"f": "manual", "p": 90, "q": "Closing the mouth, inhale with control and concentration through ida and pingala, so that the breath is felt from the throat to the heart and produces a sonorous sound."}], "fix": "Materials support: breathe through the nose with lips sealed (p.33); deep breathing with sound (p.44); breath felt from the throat to the heart with a sonorous sound, mouth closed (HYP II:51, p.90); pranayama deck p.20-22 on nose breathing. Cues about constricting the glottis, 'ocean' sound or fogging a mirror are NOT in the materials.", "note": "Searched ujjayi/ocean/constrict/glottis/fog/mirror across all files; no explicit teaching cues for ujjayi."}}, {"topic": "teaching", "type": "recall", "q": "Provide 3 cues to encourage students to strengthen in virabhadrasana B.", "a": "(1) Bend the front knee deeper toward 90°, stacking knee over ankle. (2) Ground and isometrically drag the feet toward each other / press down through the outer edge of the back foot to fire the legs. (3) Reach actively out through both arms at shoulder
